<!DOCTYPE html>

<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;font-family:'Share Tech Mono',monospace;}

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: BUILD METADATA

/* INLINE:VERSION */
const BUILD_VERSION = 'dev';
/* /INLINE */

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: CONSTANTS
   ═══════════════════════════════════════════════════════════════════════════ */
const W = 480, H = 640;
const GS = {
  MENU:0, DIFF:1, MODE:2, PLAYING:3, PAUSED:4, LEVEL_CLEAR:5, GAMEOVER:6,
  VICTORY:7, OPTIONS:8, HIGHSCORES:9, NAME_ENTRY:10, BINDINGS:11,

const DIFF_CFG = [

  { name:'INTERMEDIATE', color:'#FFB800', lives:3, enemySpd:1.0, fireRate:1.0, bossHp:1.5, shield:false },
  { name:'ADVANCED',  color:'#FF4444', lives:2, enemySpd:1.4, fireRate:1.5, bossHp:2.2, shield:false }

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: CONFIG (persisted to localStorage)
   Settings UI lands in Phase 4; this scaffolding lets later phases read/write
   without touching call sites.
   ═══════════════════════════════════════════════════════════════════════════ */
const CONFIG_KEY = 'aw1977.config.v1';
const CONFIG_DEFAULTS = Object.freeze({
  renderer: 'splat3d',    // 'splat3d' (3D Gaussian Splatting) | 'classic' (2D canvas)
  crt: 'webgl',           // 'webgl' | 'css' | 'off'
  shake: 0.8,             // screen-shake multiplier
  slowMo: true,           // slow-motion on player death / boss kill
  reducedMotion: false,   // halves particles, disables shake + slow-mo
  volMaster: 0.8,
  volMusic:  0.6,
  volSfx:    0.9,
  colorblind: 'off',
  highScores: [],
  bindings: null,         // null = use DEFAULT_BINDINGS; set via Options > KEY BINDINGS
});

const Config = (() => {
  let state = { ...CONFIG_DEFAULTS };
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch (_) { /* storage disabled: keep defaults */ }
  function save() {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(state)); } catch (_) {}
  }
  return {
    get: (k) => state[k],
    set: (k, v) => { state[k] = v; save(); applyConfig(); },
    reset: () => { state = { ...CONFIG_DEFAULTS }; save(); applyConfig(); },
    snapshot: () => ({ ...state }),
  };
})();

function applyConfig() {
  const mode = Config.get('crt');
  const scan = document.getElementById('scanlines');
  const cssVig = document.getElementById('crt-overlay');
  const webglOut = document.getElementById('crt-out');
  const cssOn = mode === 'css';
  const webglOn = mode === 'webgl';
  if (scan)     scan.style.display = cssOn ? 'block' : 'none';
  if (cssVig)   cssVig.style.display = cssOn ? 'block' : 'none';
  if (webglOut) webglOut.style.display = webglOn ? 'block' : 'none';
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: AUDIO
   Inline sfxr-compatible synth → WebAudio buses → procedural chiptune music.
   No network, no external samples.
   ═══════════════════════════════════════════════════════════════════════════ */

// SFX presets — `vendor/sfxr.js/index.html` exports this schema (subset).
// Fields absent from a preset default to 0 (sfxr standard).
/* INLINE:SFXR assets/sfx/shoot.json CONST SFX_SHOOT */
const SFX_SHOOT = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/shoot_powered.json CONST SFX_SHOOT_POWERED */
const SFX_SHOOT_POWERED = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/hit_enemy.json CONST SFX_HIT_ENEMY */
const SFX_HIT_ENEMY = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/hit_player.json CONST SFX_HIT_PLAYER */
const SFX_HIT_PLAYER = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/explode_small.json CONST SFX_EXPLODE_SMALL */
const SFX_EXPLODE_SMALL = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/explode_big.json CONST SFX_EXPLODE_BIG */
const SFX_EXPLODE_BIG = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/powerup.json CONST SFX_POWERUP */
const SFX_POWERUP = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/bomb.json CONST SFX_BOMB */
const SFX_BOMB = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/menu_move.json CONST SFX_MENU_MOVE */
const SFX_MENU_MOVE = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/menu_confirm.json CONST SFX_MENU_CONFIRM */
const SFX_MENU_CONFIRM = {};
/* /INLINE */
/* INLINE:SFXR assets/sfx/boss_warn.json CONST SFX_BOSS_WARN */
const SFX_BOSS_WARN = {};
/* /INLINE */

const SFX_LIBRARY = {
  shoot: SFX_SHOOT,
  shoot_powered: SFX_SHOOT_POWERED,
  hit_enemy: SFX_HIT_ENEMY,
  hit_player: SFX_HIT_PLAYER,
  explode_small: SFX_EXPLODE_SMALL,
  explode_big: SFX_EXPLODE_BIG,
  powerup: SFX_POWERUP,
  bomb: SFX_BOMB,
  menu_move: SFX_MENU_MOVE,
  menu_confirm: SFX_MENU_CONFIRM,
  boss_warn: SFX_BOSS_WARN,
};

// Inline sfxr-style synth. Renders a sfxr parameter object to a Float32Array
// at the given sample rate. Implements wave shape, ADSR envelope, frequency
// slide, square duty sweep, vibrato, sustain punch, low-pass filter with
// resonance, high-pass filter, and basic repeat (phase reset).
function synthSfxr(p, sampleRate) {
  const SR = sampleRate;
  const waveType   = p.waveType        || 0;
  const attack     = p.attackTime      || 0;
  const sustain    = p.sustainTime     || 0.3;
  const punch      = p.sustainPunch    || 0;
  const decay      = p.decayTime       || 0.4;
  let   freq       = p.startFrequency  || 0.3;
  const minFreq    = p.minFrequency    || 0;
  let   slide      = p.slide           || 0;
  const deltaSlide = p.deltaSlide      || 0;
  const vibDepth   = p.vibratoDepth    || 0;
  const vibSpeed   = p.vibratoSpeed    || 0;
  let   duty       = p.squareDuty      || 0;
  const dutySweep  = p.dutySweep       || 0;
  const repeatSpd  = p.repeatSpeed     || 0;
  const lpCut      = p.lpFilterCutoff  !== undefined ? p.lpFilterCutoff : 1;
  const lpRes      = p.lpFilterResonance || 0;
  const hpCut      = p.hpFilterCutoff  || 0;
  const masterVol  = p.masterVolume    !== undefined ? p.masterVolume : 0.5;

  const attackSamples  = Math.max(1, Math.floor(attack  * SR));
  const sustainSamples = Math.max(1, Math.floor(sustain * SR));
  const decaySamples   = Math.max(1, Math.floor(decay   * SR));
  const totalSamples   = attackSamples + sustainSamples + decaySamples;
  const out = new Float32Array(totalSamples);

  // Low-pass state
  let lpPos = 0, lpVel = 0;
  const lpDamp = 5 * (1 - lpRes);
  // High-pass state
  let hpPos = 0;
  // Oscillator state
  let phase = 0;
  // Frequency mapping: sfxr uses fOsc = 100 / (p*p + 0.001) Hz-ish.
  // Simplified: map p in [0..1] → Hz range approx 30 Hz..8000 Hz via square law.
  function hzOf(p) {
    const pp = Math.max(0.01, Math.min(1, p));
    return 40 + (pp * pp) * 7800;
  }
  // Repeat period in samples (0 = never repeat)
  const repeatSamples = repeatSpd > 0 ? Math.floor((1 - repeatSpd) * 20000) + 1000 : 0;
  let repeatCounter = 0;

  let vibPhase = 0;

  for (let i = 0; i < totalSamples; i++) {
    // Repeat reset
    if (repeatSamples > 0) {
      repeatCounter++;
      if (repeatCounter >= repeatSamples) {
        repeatCounter = 0;
        freq  = p.startFrequency || 0.3;
        slide = p.slide || 0;
        duty  = p.squareDuty || 0;
      }
    }
    // Slide + delta slide
    slide += deltaSlide * 0.00001;
    freq  *= 1 + slide * 0.001;
    if (freq < minFreq) freq = minFreq;
    if (freq > 1) freq = 1;
    // Vibrato
    vibPhase += vibSpeed * 0.06;
    const fVib = freq * (1 + Math.sin(vibPhase) * vibDepth * 0.1);
    // Duty sweep
    duty = Math.max(0, Math.min(0.5, duty + dutySweep * 0.00005));

    // Oscillator
    const hz = hzOf(fVib);
    phase += hz / SR;
    if (phase >= 1) phase -= 1;
    let sample;
    switch (waveType) {
      case 1: sample = 1 - phase * 2; break;                    // saw
      case 2: sample = Math.sin(phase * Math.PI * 2); break;    // sine
      case 3: sample = Math.random() * 2 - 1; break;            // noise
      default: sample = phase < duty + 0.25 ? 0.5 : -0.5;       // square
    }
    // Low-pass filter
    const lpPosOld = lpPos;
    const cutoff = lpCut * lpCut;
    lpVel += (sample - lpPos) * cutoff;
    lpVel -= lpVel * lpDamp * 0.01;
    lpPos += lpVel;
    sample = lpPos;
    // High-pass filter (one-pole)
    hpPos = hpPos * (1 - hpCut * 0.05) + (sample - lpPosOld);
    sample = hpPos;

    // Envelope
    let env;
    if (i < attackSamples) {
      env = i / attackSamples;
    } else if (i < attackSamples + sustainSamples) {
      const s = (i - attackSamples) / sustainSamples;
      env = 1 + punch * (1 - s) * 2;
    } else {
      env = 1 - (i - attackSamples - sustainSamples) / decaySamples;
    }
    out[i] = Math.max(-1, Math.min(1, sample * env * masterVol));
  }
  return out;
}

const Audio = (() => {
  let ctx = null;
  let masterGain, musicGain, sfxGain;
  const buffers = new Map();   // name -> AudioBuffer
  let musicNodes = null;       // active music graph { stop(), setGain() }
  let currentTrack = null;
  let duckTargetGain = 1;
  let duckReleaseAt = 0;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    masterGain = ctx.createGain();
    musicGain  = ctx.createGain();
    sfxGain    = ctx.createGain();
    masterGain.gain.value = Config.get('volMaster');
    musicGain.gain.value  = Config.get('volMusic');
    sfxGain.gain.value    = Config.get('volSfx');
    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(ctx.destination);
    // Pre-render all SFX buffers now that we have a sample rate.
    for (const [name, params] of Object.entries(SFX_LIBRARY)) {
      const pcm = synthSfxr(params, ctx.sampleRate);
      const buf = ctx.createBuffer(1, pcm.length, ctx.sampleRate);
      buf.copyToChannel(pcm, 0);
      buffers.set(name, buf);
    }
    return ctx;
  }

  function resumeOnGesture() {
    const resume = () => { if (ctx && ctx.state === 'suspended') ctx.resume(); };
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
      window.addEventListener(ev, resume, { once: false, passive: true });
    });
  }

  function play(name) {
    const c = ensure();
    if (!c || Config.get('volMaster') <= 0) return;
    const buf = buffers.get(name);
    if (!buf) return;
    const src = c.createBufferSource();
    src.buffer = buf;
    src.connect(sfxGain);
    src.start();
  }

  // Duck music: drop musicGain to `amount` (0..1) for `ms` then ramp back.
  function duck(amount, ms) {
    const c = ensure();
    if (!c || !musicGain) return;
    const now = c.currentTime;
    const releaseAt = now + ms / 1000;
    duckReleaseAt = releaseAt;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(Config.get('volMusic') * amount, now);
    musicGain.gain.linearRampToValueAtTime(Config.get('volMusic'), releaseAt);
  }

  // Apply config volume changes live.
  function applyVolumes() {
    if (!ctx) return;
    masterGain.gain.value = Config.get('volMaster');
    if (!duckReleaseAt || ctx.currentTime > duckReleaseAt) {
      musicGain.gain.value = Config.get('volMusic');
    }
    sfxGain.gain.value = Config.get('volSfx');
  }

  // Simple note-sequence music engine: schedules a loop of pitched pulses.
  // Each track = { bpm, pattern: [[note, len], ...], wave, bass }
  // note: midi-ish number; 0 = rest. len: beats.
  function midiToHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  function playMusic(track) {
    if (currentTrack === track && musicNodes) return;
    stopMusic();
    const c = ensure();
    if (!c) return;
    currentTrack = track;
    const { bpm, lead, bass, wave } = track;
    const beat = 60 / bpm;
    const lookahead = 0.1;
    const scheduleAhead = 0.25;
    let leadIdx = 0, bassIdx = 0;
    let leadTime = c.currentTime + 0.05;
    let bassTime = c.currentTime + 0.05;
    let active = true;
    const voices = [];

    function scheduleNote(note, len, startAt, gainNode, waveType, vol) {
      if (!active || note === 0) return;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = waveType;
      osc.frequency.value = midiToHz(note);
      const dur = len * beat;
      const attack = 0.01;
      const release = Math.min(0.08, dur * 0.4);
      g.gain.setValueAtTime(0, startAt);
      g.gain.linearRampToValueAtTime(vol, startAt + attack);
      g.gain.setValueAtTime(vol, startAt + Math.max(attack, dur - release));
      g.gain.linearRampToValueAtTime(0, startAt + dur);
      osc.connect(g); g.connect(gainNode);
      osc.start(startAt);
      osc.stop(startAt + dur + 0.02);
      voices.push(osc);
    }

    const scheduler = setInterval(() => {
      if (!active) return;
      const now = c.currentTime;
      while (leadTime < now + scheduleAhead) {
        const [note, len] = lead[leadIdx % lead.length];
        scheduleNote(note, len, leadTime, musicGain, wave.lead, 0.14);
        leadTime += len * beat;
        leadIdx++;
      }
      while (bassTime < now + scheduleAhead) {
        const [note, len] = bass[bassIdx % bass.length];
        scheduleNote(note, len, bassTime, musicGain, wave.bass, 0.18);
        bassTime += len * beat;
        bassIdx++;
      }
    }, lookahead * 1000);

    musicNodes = {
      stop() {
        active = false;
        clearInterval(scheduler);
        voices.forEach(v => { try { v.stop(); } catch (_) {} });
      }
    };
  }

  function stopMusic() {
    if (musicNodes) { musicNodes.stop(); musicNodes = null; }
    currentTrack = null;
  }

  return { play, duck, playMusic, stopMusic, applyVolumes, resumeOnGesture, ensure };
})();

// Three procedural chiptune tracks. Notes are MIDI numbers; 0 = rest.
const MUSIC_MENU = {
  bpm: 96,
  wave: { lead: 'triangle', bass: 'square' },
  lead: [[72,0.5],[76,0.5],[79,0.5],[76,0.5],[74,0.5],[72,0.5],[76,1.0],
         [74,0.5],[72,0.5],[69,0.5],[72,0.5],[74,1.0],[72,2.0]],
  bass: [[48,2],[45,2],[43,2],[48,2]],
};
const MUSIC_STAGE = {
  bpm: 132,
  wave: { lead: 'square', bass: 'sawtooth' },
  lead: [[69,0.25],[72,0.25],[76,0.25],[79,0.25],[81,0.5],[79,0.25],[76,0.25],
         [74,0.5],[72,0.5],[69,0.25],[72,0.25],[74,0.25],[76,0.25],[77,0.5],[74,0.5],
         [72,0.5],[69,0.5],[67,0.5],[65,0.5]],
  bass: [[45,0.5],[45,0.5],[48,0.5],[45,0.5],[43,0.5],[43,0.5],[46,0.5],[43,0.5]],
};
const MUSIC_BOSS = {
  bpm: 148,
  wave: { lead: 'sawtooth', bass: 'square' },
  lead: [[64,0.25],[67,0.25],[70,0.25],[67,0.25],[64,0.25],[67,0.25],[70,0.25],[72,0.5],
         [70,0.25],[67,0.25],[64,0.5],[63,0.25],[65,0.25],[67,0.5],[70,0.5],[72,0.25],[70,0.25]],
  bass: [[40,0.5],[40,0.5],[40,0.25],[40,0.25],[43,0.5],[42,0.5],[40,0.5]],
};

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — POST-PROCESS (WebGL CRT shader)
   GLSL adapted from vendor/webgl-crt-shader/CRTShader.js (MIT).
   Stripped of Three.js uniforms we don't need; runs against WebGL1 so older
   devices still work.
   ═══════════════════════════════════════════════════════════════════════════ */
const CRT = (() => {
  let gl, out, prog, tex, vbo, uniforms;
  let lastSrc = null;
  let aberration = 0;
  let aberrationUntil = 0;
  let ready = false;

  const VS = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }`;
  const FS = `
    precision mediump float;
    uniform sampler2D uTex;
    uniform float uTime;
    uniform float uScanIntensity;
    uniform float uScanCount;
    uniform float uBrightness;
    uniform float uContrast;
    uniform float uSaturation;
    uniform float uBloom;
    uniform float uRgbShift;
    uniform float uVignette;
    uniform float uCurvature;
    uniform float uFlicker;
    varying vec2 vUv;
    const float PI = 3.14159265;
    const vec3 LUMA = vec3(0.299, 0.587, 0.114);
    vec2 curve(vec2 uv, float k) {
      vec2 c = uv * 2.0 - 1.0;
      c = c * (1.0 + dot(c, c) * k * 0.25);
      return c * 0.5 + 0.5;
    }
    void main() {
      vec2 uv = vUv;
      if (uCurvature > 0.001) {
        uv = curve(uv, uCurvature);
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }
      }
      vec4 px = texture2D(uTex, uv);
      // Bloom — cheap cross-tap
      if (uBloom > 0.001) {
        float lum = dot(px.rgb, LUMA);
        if (lum > 0.25) {
          float r = 0.005;
          vec4 b = (texture2D(uTex, uv + vec2(r, 0.0))
                 +  texture2D(uTex, uv - vec2(r, 0.0))
                 +  texture2D(uTex, uv + vec2(0.0, r))
                 +  texture2D(uTex, uv - vec2(0.0, r))) * 0.25;
          px.rgb += b.rgb * uBloom * max(0.0, lum - 0.25);
        }
      }
      // RGB shift (chromatic aberration)
      if (uRgbShift > 0.001) {
        float s = uRgbShift * 0.006;
        px.r = texture2D(uTex, vec2(uv.x + s, uv.y)).r;
        px.b = texture2D(uTex, vec2(uv.x - s, uv.y)).b;
      }
      px.rgb *= uBrightness;
      float l = dot(px.rgb, LUMA);
      px.rgb = (px.rgb - 0.5) * uContrast + 0.5;
      px.rgb = mix(vec3(l), px.rgb, uSaturation);
      // Scanlines
      float mask = 1.0;
      if (uScanIntensity > 0.001) {
        float sp = abs(sin(uv.y * uScanCount * PI));
        mask *= 1.0 - sp * uScanIntensity;
      }
      // Flicker
      if (uFlicker > 0.001) {
        mask *= 1.0 + sin(uTime * 110.0) * uFlicker;
      }
      // Vignette
      if (uVignette > 0.001) {
        vec2 vc = uv * 2.0 - 1.0;
        float d = max(abs(vc.x), abs(vc.y));
        mask *= 1.0 - d * d * uVignette;
      }
      px.rgb *= mask;
      gl_FragColor = vec4(px.rgb, 1.0);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn('[CRT] shader error:', gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  function init(srcCanvas) {
    if (ready) return true;
    out = document.getElementById('crt-out');
    if (!out) return false;
    out.width = srcCanvas.width;
    out.height = srcCanvas.height;
    gl = out.getContext('webgl', { alpha: false, antialias: false });
    if (!gl) return false;
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    const vs = compile(gl.VERTEX_SHADER, VS);
    const fs = compile(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return false;
    prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.bindAttribLocation(prog, 0, 'aPos');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.warn('[CRT] link error:', gl.getProgramInfoLog(prog));
      return false;
    }
    vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    uniforms = {};
    for (const name of ['uTex','uTime','uScanIntensity','uScanCount','uBrightness',
                        'uContrast','uSaturation','uBloom','uRgbShift','uVignette',
                        'uCurvature','uFlicker']) {
      uniforms[name] = gl.getUniformLocation(prog, name);
    }
    lastSrc = srcCanvas;
    ready = true;
    return true;
  }

  function draw(srcCanvas, time) {
    if (Config.get('crt') !== 'webgl') return;
    if (!ready && !init(srcCanvas)) { Config.set('crt', 'css'); return; }
    if (out.width !== srcCanvas.width || out.height !== srcCanvas.height) {
      out.width = srcCanvas.width; out.height = srcCanvas.height;
    }
    gl.viewport(0, 0, out.width, out.height);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
    const ab = time < aberrationUntil ? aberration : 0.2;
    gl.uniform1i(uniforms.uTex, 0);
    gl.uniform1f(uniforms.uTime,           time / 1000);
    gl.uniform1f(uniforms.uScanIntensity,  0.22);
    gl.uniform1f(uniforms.uScanCount,      240);
    gl.uniform1f(uniforms.uBrightness,     1.08);
    gl.uniform1f(uniforms.uContrast,       1.05);
    gl.uniform1f(uniforms.uSaturation,     1.15);
    gl.uniform1f(uniforms.uBloom,          0.55);
    gl.uniform1f(uniforms.uRgbShift,       ab);
    gl.uniform1f(uniforms.uVignette,       0.45);
    gl.uniform1f(uniforms.uCurvature,      0.18);
    gl.uniform1f(uniforms.uFlicker,        0.008);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function pulseAberration(amount, ms) {
    const now = performance.now();
    aberration = Math.max(aberration, amount);
    aberrationUntil = Math.max(aberrationUntil, now + ms);
  }

  return { init, draw, pulseAberration };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — CAMERA (shake, slow-mo, hit flash, chromatic aberration)
   ═══════════════════════════════════════════════════════════════════════════ */
const Camera = (() => {
  let shakeAmt = 0, shakeEnd = 0;
  let flashColor = null, flashEnd = 0, flashMax = 0;
  let slowEnd = 0, slowFactor = 1;

  function shake(intensity, ms) {
    if (Config.get('reducedMotion')) return;
    const now = performance.now();
    const strength = intensity * Config.get('shake');
    shakeAmt = Math.max(shakeAmt, strength);
    shakeEnd = Math.max(shakeEnd, now + ms);
  }
  function flash(color, ms) {
    const now = performance.now();
    flashColor = color;
    flashEnd = now + ms;
    flashMax = ms;
  }
  function slowMo(factor, ms) {
    if (!Config.get('slowMo') || Config.get('reducedMotion')) return;
    const now = performance.now();
    slowFactor = factor;
    slowEnd = Math.max(slowEnd, now + ms);
  }
  function timeScale() {
    return performance.now() < slowEnd ? slowFactor : 1;
  }
  function preRender(ctx, time) {
    if (time < shakeEnd) {
      const t = (shakeEnd - time) / 400;
      const mag = shakeAmt * t * 12;
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    } else {
      shakeAmt = 0;
    }
  }
  function postRender(ctx, time) {
    if (flashColor && time < flashEnd) {
      const a = ((flashEnd - time) / flashMax) * 0.5;
      ctx.fillStyle = flashColor;
      ctx.globalAlpha = a;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  return { shake, flash, slowMo, timeScale, preRender, postRender };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — CONFETTI (DIY, ~40 lines; vendor/canvas-confetti as ref)
   ═══════════════════════════════════════════════════════════════════════════ */
const Confetti = (() => {
  const pieces = [];
  function burst(x, y, colors, count) {
    const n = Config.get('reducedMotion') ? Math.ceil(count * 0.4) : count;
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
      const spd = 4 + Math.random() * 6;
      pieces.push({
        x, y,
        vx: Math.cos(ang) * spd + (Math.random() - 0.5) * 2,
        vy: Math.sin(ang) * spd,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.5,
        w: 4 + Math.random() * 4,
        h: 2 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 80 + Math.random() * 60,
      });
    }
  }
  function update() {
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15; p.vx *= 0.99;
      p.rot += p.vrot;
      p.life--;
      if (p.life <= 0 || p.y > H + 40) pieces.splice(i, 1);
    }
  }
  function draw(ctx) {
    for (const p of pieces) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  return { burst, update, draw };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: UTILITY
   ═══════════════════════════════════════════════════════════════════════════ */
const rnd = (a,b) => Math.random()*(b-a)+a;
const rndInt = (a,b) => Math.floor(rnd(a,b+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const lerp = (a,b,t) => a+(b-a)*t;

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — CANVAS SETUP
   ═══════════════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/W, vh/H);
  canvas.style.width  = (W*scale)+'px';
  canvas.style.height = (H*scale)+'px';
  const crtOut = document.getElementById('crt-out');
  if (crtOut) {
    crtOut.style.width  = (W*scale)+'px';
    crtOut.style.height = (H*scale)+'px';
  }
  const mc = document.getElementById('mobile-controls');
  mc.style.width  = (W*scale)+'px';
  mc.style.height = (H*scale)+'px';
  mc.style.left = ((vw - W*scale)/2)+'px';
  mc.style.top  = ((vh - H*scale)/2)+'px';
  const wrap = document.getElementById('wrapper');
  wrap.style.width  = (W*scale)+'px';
  wrap.style.height = (H*scale)+'px';
}
window.addEventListener('resize', resize); resize();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — STARFIELD (3 parallax layers + nebula)
   ═══════════════════════════════════════════════════════════════════════════ */
const STARS_FAR = Array.from({length:80}, () => ({
  x:rnd(0,W), y:rnd(0,H), spd:rnd(0.08,0.25), sz:rnd(0.5,1.2),
  bright:rnd(0.15,0.35), hue: Math.random() < 0.2 ? '#88AACC' : '#CCCCFF'
}));
const STARS_MID = Array.from({length:80}, () => ({
  x:rnd(0,W), y:rnd(0,H), spd:rnd(0.35,0.8), sz:rnd(0.8,1.8),
  bright:rnd(0.35,0.7), hue:'#FFEEDD'
}));
const STARS_NEAR = Array.from({length:60}, () => ({
  x:rnd(0,W), y:rnd(0,H), spd:rnd(1.0,2.2), sz:rnd(1.2,2.4),
  bright:rnd(0.6,0.95), hue:'#FFE8B0'
}));
const NEBULAE = Array.from({length:3}, () => ({
  x:rnd(0,W), y:rnd(-H, H), r:rnd(80,160),
  hue: ['#221155','#551144','#113355'][Math.floor(Math.random()*3)],
  spd:rnd(0.05,0.12),
}));

function updateStarLayer(layer) {
  layer.forEach(s => {
    s.y += s.spd;
    if(s.y > H) { s.y = -2; s.x = rnd(0,W); }
  });
}

function updateStarfield() {
  NEBULAE.forEach(n => {
    n.y += n.spd;
    if (n.y > H + n.r) { n.y = -n.r; n.x = rnd(0,W); }
  });
  updateStarLayer(STARS_FAR);
  updateStarLayer(STARS_MID);
  updateStarLayer(STARS_NEAR);
}

function drawStarLayer(layer) {
  layer.forEach(s => {
    ctx.fillStyle = s.hue.length === 7
      ? `rgba(${parseInt(s.hue.slice(1,3),16)},${parseInt(s.hue.slice(3,5),16)},${parseInt(s.hue.slice(5,7),16)},${s.bright})`
      : s.hue;
    ctx.fillRect(s.x, s.y, s.sz, s.sz*2);
  });
}

function drawStars() {
  // In splat mode the background is rendered (and the field advanced) by
  // GSplat.frame() once per rAF; menu screens that call drawStars() get it
  // for free underneath, so this becomes a no-op.
  if (GSplat.active()) return;
  updateStarfield();
  // Nebulae — soft background blobs
  NEBULAE.forEach(n => {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, n.hue + 'AA');
    grad.addColorStop(1, n.hue + '00');
    ctx.fillStyle = grad;
    ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  });
  drawStarLayer(STARS_FAR);
  drawStarLayer(STARS_MID);
  drawStarLayer(STARS_NEAR);
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — GSPLAT (3D Gaussian Splatting renderer)
   Every world element — ships, bullets, explosions, the starfield — is a
   cloud of anisotropic 3D gaussians, rendered with the standard 3DGS
   pipeline: per-splat covariance Σ = R·S·Sᵀ·Rᵀ is projected through the
   perspective Jacobian (Σ' = J·W·Σ·Wᵀ·Jᵀ), eigen-decomposed into a
   screen-space ellipse, and composited back-to-front as premultiplied-alpha
   gaussian billboards (one instanced draw call per frame).
   Game logic stays 2D; a perspective camera with a gentle tilt looks down
   the playfield so waves fly in from the distance. HUD/menus remain on the
   2D canvas, composited on top, so the CRT post-process is untouched.
   Toggled via Options → RENDERER (SPLAT3D | CLASSIC).
   ═══════════════════════════════════════════════════════════════════════════ */
const GSplat = (() => {
  // ── Camera ────────────────────────────────────────────────────────────────
  const TILT = 0.16;                 // rad — playfield recedes toward the top
  const CAM_DIST = 740;              // camera distance to playfield center
  const FOVY = 50 * Math.PI / 180;
  const FOCAL = (H / 2) / Math.tan(FOVY / 2);
  const ST = Math.sin(TILT), CT = Math.cos(TILT);
  let swayX = 0, swayY = 0;          // parallax sway (smoothed)

  // ── GL state ──────────────────────────────────────────────────────────────
  const MAX_SPLATS = 12000;
  const STRIDE = 14;                 // floats: center(3) scale(3) quat(4) rgba(4)
  let glCanvas, gl, prog, quadBuf, instBuf, uniforms, instExt, isGL2;
  let supported = null;              // null = not probed yet
  const data = new Float32Array(MAX_SPLATS * STRIDE);
  const sortedData = new Float32Array(MAX_SPLATS * STRIDE);
  const keys = new Float32Array(MAX_SPLATS);
  let count = 0;

  const VS = `
    precision highp float;
    attribute vec2 aCorner;
    attribute vec3 aCenter;
    attribute vec3 aScale;
    attribute vec4 aQuat;
    attribute vec4 aColor;
    uniform mat4 uView;
    uniform mat4 uProj;
    uniform vec2 uFocal;
    uniform vec2 uViewport;
    varying vec4 vColor;
    varying vec2 vPos;
    void main() {
      vec4 cam = uView * vec4(aCenter, 1.0);
      if (cam.z > -30.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
      // Rotation from quaternion
      float x = aQuat.x, y = aQuat.y, z = aQuat.z, w = aQuat.w;
      mat3 R = mat3(
        1.0-2.0*(y*y+z*z), 2.0*(x*y+w*z),     2.0*(x*z-w*y),
        2.0*(x*y-w*z),     1.0-2.0*(x*x+z*z), 2.0*(y*z+w*x),
        2.0*(x*z+w*y),     2.0*(y*z-w*x),     1.0-2.0*(x*x+y*y));
      mat3 S = mat3(aScale.x,0.,0., 0.,aScale.y,0., 0.,0.,aScale.z);
      float iz = 1.0 / cam.z;
      mat3 J = mat3(
        uFocal.x*iz, 0.0, 0.0,
        0.0, uFocal.y*iz, 0.0,
        -uFocal.x*cam.x*iz*iz, -uFocal.y*cam.y*iz*iz, 0.0);
      mat3 B = J * mat3(uView) * R * S;
      // 2D covariance = B·Bᵀ (only the upper-left 2×2 survives J)
      vec3 r0 = vec3(B[0][0], B[1][0], B[2][0]);
      vec3 r1 = vec3(B[0][1], B[1][1], B[2][1]);
      float a = dot(r0, r0) + 0.3;
      float b = dot(r0, r1);
      float c = dot(r1, r1) + 0.3;
      float mid = 0.5 * (a + c);
      float disc = sqrt(max(0.01, mid * mid - (a * c - b * b)));
      float l1 = mid + disc, l2 = max(mid - disc, 0.01);
      vec2 e1 = (abs(b) < 1e-6)
        ? ((a >= c) ? vec2(1.0, 0.0) : vec2(0.0, 1.0))
        : normalize(vec2(b, l1 - a));
      vec2 e2 = vec2(-e1.y, e1.x);
      float r1px = min(3.0 * sqrt(l1), 420.0);
      float r2px = min(3.0 * sqrt(l2), 420.0);
      vec2 offsetPx = aCorner.x * r1px * e1 + aCorner.y * r2px * e2;
      vec4 clip = uProj * cam;
      clip.xy += offsetPx / (0.5 * uViewport) * clip.w;
      gl_Position = clip;
      vColor = aColor;
      vPos = aCorner * 3.0;   // quad spans ±3σ
    }`;
  const FS = `
    precision mediump float;
    varying vec4 vColor;
    varying vec2 vPos;
    void main() {
      float r2 = dot(vPos, vPos);
      if (r2 > 9.0) discard;
      float g = exp(-0.5 * r2) * vColor.a;
      if (g < 0.004) discard;
      gl_FragColor = vec4(vColor.rgb * g, g);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn('[GSplat] shader error:', gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  // Try WebGL2 first, then WebGL1 + ANGLE_instanced_arrays. Each attempt gets
  // a fresh canvas (a canvas bound to one context kind won't hand out another),
  // so a WebGL2 shader/link failure still falls through to the WebGL1 path.
  function init() {
    return initContext('webgl2') || initContext('webgl');
  }

  function initContext(kind) {
    glCanvas = document.createElement('canvas');
    glCanvas.width = W; glCanvas.height = H;
    const opts = { alpha: false, antialias: false, depth: false, stencil: false };
    gl = glCanvas.getContext(kind, opts);
    if (!gl) return false;
    isGL2 = kind === 'webgl2';
    if (!isGL2) {
      instExt = gl.getExtension('ANGLE_instanced_arrays');
      if (!instExt) return false;
    }
    const vs = compile(gl.VERTEX_SHADER, VS);
    const fs = compile(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return false;
    prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.bindAttribLocation(prog, 0, 'aCorner');
    gl.bindAttribLocation(prog, 1, 'aCenter');
    gl.bindAttribLocation(prog, 2, 'aScale');
    gl.bindAttribLocation(prog, 3, 'aQuat');
    gl.bindAttribLocation(prog, 4, 'aColor');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.warn('[GSplat] link error:', gl.getProgramInfoLog(prog));
      return false;
    }
    quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    instBuf = gl.createBuffer();
    uniforms = {};
    for (const n of ['uView','uProj','uFocal','uViewport'])
      uniforms[n] = gl.getUniformLocation(prog, n);
    gl.useProgram(prog);
    // Static projection
    const near = 20, far = 5000, aspect = W / H;
    const f = 1 / Math.tan(FOVY / 2);
    gl.uniformMatrix4fv(uniforms.uProj, false, new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) / (near - far), -1,
      0, 0, 2 * far * near / (near - far), 0,
    ]));
    gl.uniform2f(uniforms.uFocal, FOCAL, FOCAL);
    gl.uniform2f(uniforms.uViewport, W, H);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0.02, 1);
    return true;
  }

  function ensure() {
    if (supported === null) {
      supported = false;
      try { supported = init(); } catch (e) { console.warn('[GSplat] init failed:', e); }
      if (!supported) console.warn('[GSplat] unavailable — falling back to classic renderer');
    }
    return supported;
  }

  function active() {
    if (Config.get('renderer') !== 'splat3d') return false;
    return ensure();
  }

  // ── Splat sink ────────────────────────────────────────────────────────────
  // World frame: x right, y DOWN (game coords), z up out of the playfield.
  function push(x, y, z, sx, sy, sz, qx, qy, qz, qw, r, g, b, a) {
    if (count >= MAX_SPLATS) return;
    const o = count * STRIDE;
    data[o] = x; data[o+1] = y; data[o+2] = z;
    data[o+3] = sx; data[o+4] = sy; data[o+5] = sz;
    data[o+6] = qx; data[o+7] = qy; data[o+8] = qz; data[o+9] = qw;
    data[o+10] = r; data[o+11] = g; data[o+12] = b; data[o+13] = a;
    keys[count] = ST * y + CT * z;   // view-space depth (constants dropped)
    count++;
  }

  // Emit a prebuilt model at (gx,gy,gz), spun `rot` about z, scaled, faded.
  function pushModel(m, gx, gy, gz, rot, scl, alpha) {
    if (rot === 0) {
      for (let i = 0; i < m.length; i += STRIDE) {
        push(gx + m[i]*scl, gy + m[i+1]*scl, gz + m[i+2]*scl,
             m[i+3]*scl, m[i+4]*scl, m[i+5]*scl,
             m[i+6], m[i+7], m[i+8], m[i+9],
             m[i+10], m[i+11], m[i+12], m[i+13]*alpha);
      }
      return;
    }
    const cs = Math.cos(rot), sn = Math.sin(rot);
    const s2 = Math.sin(rot / 2), c2 = Math.cos(rot / 2);
    for (let i = 0; i < m.length; i += STRIDE) {
      const px = m[i]*scl, py = m[i+1]*scl;
      const qx = m[i+6], qy = m[i+7], qz = m[i+8], qw = m[i+9];
      push(gx + px*cs - py*sn, gy + px*sn + py*cs, gz + m[i+2]*scl,
           m[i+3]*scl, m[i+4]*scl, m[i+5]*scl,
           c2*qx - s2*qy, c2*qy + s2*qx, c2*qz + s2*qw, c2*qw - s2*qz,
           m[i+10], m[i+11], m[i+12], m[i+13]*alpha);
    }
  }

  // ── Color / model helpers ─────────────────────────────────────────────────
  const hexCache = {};
  function hex(h) {
    let c = hexCache[h];
    if (!c) {
      c = hexCache[h] = [
        parseInt(h.slice(1,3),16)/255,
        parseInt(h.slice(3,5),16)/255,
        parseInt(h.slice(5,7),16)/255];
    }
    return c;
  }
  const QI = [0, 0, 0, 1];   // identity quat

  // sp(model, x,y,z, sx,sy,sz, colorHexOrRgb, alpha[, quat]) — model builder
  function sp(m, x, y, z, sx, sy, sz, c, a, q) {
    const rgb = typeof c === 'string' ? hex(c) : c;
    q = q || QI;
    m.push(x, y, z, sx, sy, sz, q[0], q[1], q[2], q[3], rgb[0], rgb[1], rgb[2], a);
  }
  function shade(c, k) {
    const rgb = typeof c === 'string' ? hex(c) : c;
    return [Math.min(1, rgb[0]*k), Math.min(1, rgb[1]*k), Math.min(1, rgb[2]*k)];
  }

  // ── Entity models (built once; positions in game orientation: -y = nose) ──
  function buildShip(color, engine) {
    const m = [];
    // Fuselage spine, nose to tail
    for (let i = 0; i < 6; i++) {
      const t = i / 5;
      sp(m, 0, -14 + t*24, 2.5, 3.6 - t*1.0, 4.4, 2.6, shade(color, 1.15 - t*0.35), 0.92);
    }
    // Canopy
    sp(m, 0, -5, 4.5, 2.0, 3.0, 2.0, '#AEDCFF', 0.95);
    sp(m, 0, -6, 5.2, 0.9, 1.5, 1.0, '#FFFFFF', 0.9);
    // Swept wings
    for (const side of [-1, 1]) {
      for (let i = 0; i < 5; i++) {
        const t = i / 4;
        sp(m, side*(3.5 + t*8.5), 1 + t*8.5, 1.5, 3.2 - t*1.5, 3.4 - t*1.2, 1.5, shade(color, 0.9 - t*0.25), 0.85);
      }
      sp(m, side*12.5, 10, 1.8, 1.1, 1.1, 1.1, '#FFFFFF', 0.9);    // wingtip light
      sp(m, side*3.5, 11.5, 2.5, 1.5, 2.4, 1.6, shade(color, 0.75), 0.8); // tail fins
    }
    // Engine glow
    sp(m, 0, 12.5, 2, 2.6, 3.4, 2.0, engine, 0.85);
    return m;
  }

  function buildEnemy(type, color) {
    const m = [];
    switch (type) {
      case 'basic':   // triangle, nose toward player (+y)
        for (let i = 0; i < 4; i++) {
          const t = i / 3;
          sp(m, 0, 9 - t*17, 2, 2.2 + t*6.5, 3.4, 2.2, shade(color, 1.1 - t*0.35), 0.9);
        }
        sp(m, 0, 4, 3.5, 1.6, 1.6, 1.4, shade(color, 1.6), 0.9);   // hot nose
        break;
      case 'weaver':  // bat-wing crescent
        for (const side of [-1, 1]) {
          for (let i = 0; i < 3; i++) {
            const t = i / 2;
            sp(m, side*(2.5 + t*6.5), -2 - t*5, 2, 3.0 - t*0.8, 3.2 - t*0.9, 1.8, shade(color, 1.05 - t*0.3), 0.88);
          }
        }
        sp(m, 0, 4, 2.5, 3.2, 3.6, 2.2, shade(color, 1.25), 0.92);  // core
        break;
      case 'bomber':  // fat saucer
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          sp(m, Math.cos(a)*11, Math.sin(a)*8.5, 2, 5.0, 4.4, 2.6, shade(color, 0.95), 0.8);
        }
        sp(m, 0, 0, 3, 7.5, 6.5, 3.2, shade(color, 1.1), 0.85);
        sp(m, 0, 0, 5, 3.4, 3.0, 2.0, '#660044', 0.95);            // dark core
        sp(m, -5, 9, 2, 1.4, 1.8, 1.2, '#FF8866', 0.85);           // engines
        sp(m,  5, 9, 2, 1.4, 1.8, 1.2, '#FF8866', 0.85);
        break;
      case 'kamikaze': // hot little dart
        for (let i = 0; i < 3; i++) {
          const t = i / 2;
          sp(m, 0, 7 - t*13, 2, 1.8 + t*3.2, 3.0, 1.8, shade(color, 1.25 - t*0.4), 0.9);
        }
        sp(m, 0, 6, 2.5, 1.6, 2.8, 1.6, '#FFFFFF', 0.75);          // hot tip
        sp(m, 0, -8, 2, 2.2, 4.5, 1.8, '#FF6600', 0.5);            // exhaust
        break;
      case 'elite':   // spinning hex ring
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3;
          sp(m, Math.cos(a)*11, Math.sin(a)*10, 2, 3.0, 3.0, 2.2, shade(color, 1.05), 0.9);
          sp(m, Math.cos(a + Math.PI/6)*7, Math.sin(a + Math.PI/6)*6.5, 2, 2.0, 2.0, 1.6, shade(color, 0.7), 0.7);
        }
        sp(m, 0, 0, 3.5, 3.6, 3.6, 2.6, '#FFFFFF', 0.85);          // bright core
        break;
    }
    return m;
  }

  function buildBossHull(color) {
    const m = [];
    // Broad hull slab (trapezoid, wide at mid, tapering down-screen)
    for (let iy = 0; iy < 4; iy++) {
      const t = iy / 3;
      const y = -26 + t * 52;
      const halfW = 38 - Math.abs(t - 0.35) * 26;
      const n = 5;
      for (let ix = 0; ix < n; ix++) {
        const fx = n === 1 ? 0 : (ix / (n - 1) - 0.5) * 2;
        sp(m, fx * halfW, y, 3, 10.5, 9.0, 4.5, shade(color, 1.05 - Math.abs(fx)*0.3 - t*0.15), 0.8);
      }
    }
    // Dark reactor core + white ring
    sp(m, 0, 0, 7, 9.5, 7.5, 4.0, '#100208', 0.97);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      sp(m, Math.cos(a)*15, Math.sin(a)*11, 8, 1.7, 1.7, 1.4, '#FFFFFF', 0.9);
    }
    return m;
  }

  function buildPowerUp(color) {
    const m = [];
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      sp(m, Math.cos(a)*11, Math.sin(a)*11, 0, 2.2, 2.2, 1.8, color, 0.8);
    }
    sp(m, 0, 0, 1, 4.5, 4.5, 3.5, shade(color, 1.3), 0.5);
    sp(m, 0, 0, 2, 1.8, 1.8, 1.5, '#FFFFFF', 0.55);
    return m;
  }

  function buildWreck(color) {
    const m = [];
    const pts = [[-11,-3],[7,-9],[11,5],[-5,7],[0,-2],[-8,3],[5,0]];
    pts.forEach(([x, y], i) => {
      sp(m, x, y, 1.5, 2.6, 2.4, 1.6, i % 2 ? shade(color, 0.55) : '#556066', 0.75);
    });
    sp(m, 2, -3, 3, 1.4, 1.4, 1.2, '#FFAA55', 0.6);   // smoldering ember
    return m;
  }

  const MODELS = {};
  function buildModels() {
    MODELS.player1 = buildShip('#FFB800', '#FFA000');
    MODELS.player2 = buildShip('#44AAFF', '#33AAFF');
    for (const t of ['basic','weaver','bomber','kamikaze','elite'])
      MODELS['enemy_' + t] = null; // built lazily with the type's color below
    MODELS.enemy_basic    = buildEnemy('basic',    '#FF6633');
    MODELS.enemy_weaver   = buildEnemy('weaver',   '#FF33AA');
    MODELS.enemy_bomber   = buildEnemy('bomber',   '#AA44FF');
    MODELS.enemy_kamikaze = buildEnemy('kamikaze', '#FFAA00');
    MODELS.enemy_elite    = buildEnemy('elite',    '#00FFAA');
    MODELS.powerups = {};
    MODELS.wrecks = {};
    MODELS.bosses = {};
  }
  buildModels();

  // ── Emitters (pure readers of game state) ─────────────────────────────────
  const STAR_DEPTHS = { far: -260, mid: -140, near: -50 };

  function widen(gx, gy, depth) {
    const k = (CAM_DIST + depth) / CAM_DIST * 1.25;
    return [W/2 + (gx - W/2) * k, H/2 + (gy - H/2) * k];
  }

  function emitStars() {
    for (const [layer, depth] of [[STARS_FAR, STAR_DEPTHS.far], [STARS_MID, STAR_DEPTHS.mid], [STARS_NEAR, STAR_DEPTHS.near]]) {
      for (const s of layer) {
        const [x, y] = widen(s.x, s.y, -depth);
        const c = hex(s.hue);
        push(x, y, depth, s.sz * 0.55, s.sz * 1.1, s.sz * 0.5, 0, 0, 0, 1, c[0], c[1], c[2], s.bright);
      }
    }
  }

  function emitNebulae() {
    for (const n of NEBULAE) {
      if (!n._blob) {
        n._blob = Array.from({length: 5}, () => ({
          ox: rnd(-0.5, 0.5) * n.r, oy: rnd(-0.5, 0.5) * n.r,
          s: rnd(0.45, 0.8) * n.r, a: rnd(0.09, 0.17), k: rnd(0.8, 1.6),
        }));
      }
      const c = hex(n.hue);
      for (const b of n._blob) {
        const [x, y] = widen(n.x + b.ox, n.y + b.oy, 320);
        push(x, y, -320, b.s, b.s, b.s * 0.5, 0, 0, 0, 1, c[0]*b.k, c[1]*b.k, c[2]*b.k, b.a);
      }
    }
  }

  function emitParticle(p) {
    const a = Math.max(0, p.life / p.maxLife);
    if (a <= 0) return;
    let r = p._rgb[0], g = p._rgb[1], b = p._rgb[2];
    if (p._rgbEnd) {
      const t = 1 - a;
      r += (p._rgbEnd[0] - r) * t; g += (p._rgbEnd[1] - g) * t; b += (p._rgbEnd[2] - b) * t;
    }
    const s = Math.max(0.5, p.sz * a * 1.5);
    if (p.shape === 'streak') {
      const spd = Math.hypot(p.vx, p.vy);
      const rot = Math.atan2(-p.vx, p.vy);
      const s2 = Math.sin(rot/2), c2 = Math.cos(rot/2);
      push(p.x, p.y, 4 + p.z, s * 0.6, s * (1.5 + spd * 0.8), s * 0.6, 0, 0, s2, c2, r, g, b, a * 0.9);
    } else {
      push(p.x, p.y, 4 + p.z, s, s, s, 0, 0, 0, 1, r, g, b, a * 0.85);
    }
  }

  function emitBullet(b) {
    const c = hex(b.color);
    const spd = Math.hypot(b.vx, b.vy);
    const rot = Math.atan2(-b.vx, b.vy);
    const s2 = Math.sin(rot/2), c2 = Math.cos(rot/2);
    const stretch = 1 + spd * 0.055;
    // halo
    push(b.x, b.y, 8, b.sz * 1.3, b.sz * 2.3 * stretch, b.sz * 1.3, 0, 0, s2, c2, c[0], c[1], c[2], 0.42);
    // hot core
    push(b.x, b.y, 9, b.sz * 0.55, b.sz * 1.4 * stretch, b.sz * 0.55, 0, 0, s2, c2, 1, 1, 1, 0.9);
    // trail
    push(b.x - b.vx * 1.5, b.y - b.vy * 1.5, 8, b.sz * 0.7, b.sz * 0.9 + spd * 0.35, b.sz * 0.7, 0, 0, s2, c2, c[0], c[1], c[2], 0.16);
  }

  function emitPowerUp(pu) {
    const c = pu.colors[pu.type];
    let m = MODELS.powerups[pu.type];
    if (!m) m = MODELS.powerups[pu.type] = buildPowerUp(c);
    const pulse = 1 + Math.sin(pu.t * 0.15) * 0.14;
    pushModel(m, pu.x, pu.y, 8, pu.t * 0.045, pulse, 1);
  }

  function emitWreck(w) {
    let m = MODELS.wrecks[w.pid];
    if (!m) m = MODELS.wrecks[w.pid] = buildWreck(w.color);
    const blink = Math.sin(w.t * 0.2) * 0.25 + 0.75;
    pushModel(m, w.x, w.y, 3, 0, 1, Math.min(1, w.life / 60) * blink);
    if (w.reviveProgress > 0) {
      // rising revival motes
      const n = 5;
      for (let i = 0; i < n; i++) {
        const a = (w.t * 0.05 + i * Math.PI * 2 / n);
        const c = hex('#FFEEBB');
        push(w.x + Math.cos(a) * 20, w.y + Math.sin(a) * 20, 4 + ((w.t * 0.7 + i * 9) % 22),
             1.6, 1.6, 1.6, 0, 0, 0, 1, c[0], c[1], c[2], 0.7);
      }
    }
  }

  function emitEnemy(e) {
    const rot = e.type === 'elite' ? e.t * 0.03 : 0;
    pushModel(MODELS['enemy_' + e.type], e.x, e.y, 6, rot, 1, 1);
  }

  function emitBoss(bs, now) {
    let hull = MODELS.bosses[bs.color];
    if (!hull) hull = MODELS.bosses[bs.color] = buildBossHull(bs.color);
    pushModel(hull, bs.x, bs.y, 8, 0, 1, 1);
    const c = hex(bs.color);
    // Rotating arms + orbs
    for (let i = 0; i < 4; i++) {
      const a = bs.armAngle + i * Math.PI / 2;
      const ex = Math.cos(a) * bs.w * 0.7, ey = Math.sin(a) * bs.h * 0.7;
      for (let j = 1; j <= 4; j++) {
        const t = j / 4;
        push(bs.x + ex * t, bs.y + ey * t, 9, 2.8 - t, 2.8 - t, 2.0, 0, 0, 0, 1, c[0], c[1], c[2], 0.8);
      }
      push(bs.x + ex, bs.y + ey, 10, 4.2, 4.2, 3.2, 0, 0, 0, 1,
           Math.min(1, c[0]*1.4), Math.min(1, c[1]*1.4), Math.min(1, c[2]*1.4), 0.9);
    }
    // Phase-2 rotating shield arc
    if (bs.phase >= 2) {
      const sc = hex('#FF6432');
      for (let i = 0; i < 14; i++) {
        const a = bs.shieldArc + (i / 13) * Math.PI * 1.5;
        push(bs.x + Math.cos(a) * bs.w * 0.9, bs.y + Math.sin(a) * bs.h * 0.85, 10,
             3.6, 3.6, 2.8, 0, 0, 0, 1, sc[0], sc[1], sc[2], 0.5);
      }
    }
    // Core throb
    const throb = 0.7 + Math.sin(now * 0.006) * 0.3;
    push(bs.x, bs.y, 11, 4.5, 4.0, 3.0, 0, 0, 0, 1, 1, 1, 1, 0.5 * throb);
  }

  function emitPlayer(p, now) {
    if (p.respawnTimer > 0) return;
    let alpha = 1, scl = 1;
    if (p.dying > 0) {
      alpha = p.dying / 60;
      scl = 1 + (1 - alpha) * 0.5;
    } else if (p.invTime > 0 && Math.floor(p.invTime / 5) % 2 === 0) {
      alpha = 0.3;
    }
    pushModel(p.pid === 1 ? MODELS.player1 : MODELS.player2, p.x, p.y, 6, 0, scl, alpha);
    if (p.dying === 0) {
      // Engine flame — flickering elongated splat
      const flame = 10 + Math.sin(p.t * 0.4) * 5;
      const ec = hex(p.pid === 1 ? '#FFA000' : '#33AAFF');
      push(p.x, p.y + p.h/2 + flame*0.5, 5, 3.2, flame * 0.75, 2.4, 0, 0, 0, 1, ec[0], ec[1], ec[2], 0.75 * alpha);
      push(p.x, p.y + p.h/2 + 3, 6, 1.6, 3.5, 1.6, 0, 0, 0, 1, 1, 1, 0.9, 0.7 * alpha);
      // Shield — translucent gaussian dome + ring
      if (p.hasShield) {
        const sc = hex('#4488FF');
        const rr = p.h * 0.7;
        push(p.x, p.y, 8, rr * 0.75, rr * 0.75, rr * 0.55, 0, 0, 0, 1, sc[0], sc[1], sc[2], 0.16);
        for (let i = 0; i < 10; i++) {
          const a = now * 0.002 + i * Math.PI / 5;
          push(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr, 7, 1.8, 1.8, 1.6, 0, 0, 0, 1, sc[0], sc[1], sc[2], 0.55);
        }
      }
    }
  }

  // Gameplay-critical entities first: draw order comes from the global depth
  // sort, not emission order, so if the MAX_SPLATS cap is ever hit only
  // cosmetic particles (and the background, emitted after this) get dropped.
  function emitWorld(now) {
    for (const p of game.players) { if (p.active || p.dying > 0 || p.respawnTimer > 0) emitPlayer(p, now); }
    for (const b of game.bullets) emitBullet(b);
    if (game.boss && !game.boss.dead) emitBoss(game.boss, now);
    for (const e of game.enemies) { if (!e.dead) emitEnemy(e); }
    for (const pu of game.powerups) emitPowerUp(pu);
    for (const w of game.wrecks) emitWreck(w);
    for (const p of particles) emitParticle(p);
  }

  // ── Frame render ──────────────────────────────────────────────────────────
  function updateSway(inWorld, now) {
    let tx = 0, ty = 0;
    if (inWorld) {
      const alive = game.players.filter(p => p.active && !p.dying);
      if (alive.length) {
        const avgX = alive.reduce((s, p) => s + p.x, 0) / alive.length;
        const avgY = alive.reduce((s, p) => s + p.y, 0) / alive.length;
        tx = (avgX - W/2) * 0.09;
        ty = (avgY - H/2) * -0.035;
      }
    } else {
      tx = Math.sin(now * 0.00015) * 14;
      ty = Math.cos(now * 0.00011) * 7;
    }
    swayX += (tx - swayX) * 0.04;
    swayY += (ty - swayY) * 0.04;
  }

  function render() {
    // Sort back-to-front and build the interleaved instance buffer
    const idx = new Array(count);
    for (let i = 0; i < count; i++) idx[i] = i;
    idx.sort((a, b) => keys[a] - keys[b]);
    for (let i = 0; i < count; i++) {
      const src = idx[i] * STRIDE, dst = i * STRIDE;
      for (let j = 0; j < STRIDE; j++) sortedData[dst + j] = data[src + j];
    }
    gl.viewport(0, 0, W, H);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    // View matrix: game coords → camera space (y-flip + tilt + dolly)
    const cx = W/2, cy = H/2;
    gl.uniformMatrix4fv(uniforms.uView, false, new Float32Array([
      1, 0, 0, 0,
      0, -CT, ST, 0,
      0, ST, CT, 0,
      -cx - swayX, CT * cy - swayY, -ST * cy - CAM_DIST, 1,
    ]));
    const divisor = isGL2
      ? (loc, d) => gl.vertexAttribDivisor(loc, d)
      : (loc, d) => instExt.vertexAttribDivisorANGLE(loc, d);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    divisor(0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, sortedData.subarray(0, count * STRIDE), gl.DYNAMIC_DRAW);
    const strideBytes = STRIDE * 4;
    const attrs = [[1, 3, 0], [2, 3, 12], [3, 4, 24], [4, 4, 40]];
    for (const [loc, size, off] of attrs) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, strideBytes, off);
      divisor(loc, 1);
    }
    if (isGL2) gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    else instExt.drawArraysInstancedANGLE(gl.TRIANGLE_STRIP, 0, 4, count);
  }

  // One call per rAF from draw(): advances the starfield, emits the scene,
  // renders, and composites into the 2D canvas.
  function frame(now, inWorld) {
    updateStarfield();
    updateSway(inWorld, now);
    count = 0;
    if (inWorld) emitWorld(now);
    emitNebulae();
    emitStars();
    render();
    ctx.drawImage(glCanvas, 0, 0);
  }

  // Project game-space (gx, gy, gz) to canvas pixels for 2D overlays.
  // Returns {x, y, s} where s = pixels per world unit at that depth.
  function project(gx, gy, gz) {
    const u = gx - W/2 - swayX;
    const v = H/2 - gy;
    const yc = CT * v + ST * (gz || 0) - swayY;
    const zc = -ST * v + CT * (gz || 0) - CAM_DIST;
    const s = FOCAL / -zc;
    return { x: W/2 + u * s, y: H/2 - yc * s, s };
  }

  return { active, frame, project, push };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — GSPLAT 2D OVERLAYS
   Screen-space chrome that must stay crisp (HP bars, labels, pickup letters)
   drawn on the 2D canvas at splat-projected positions.
   ═══════════════════════════════════════════════════════════════════════════ */
function drawWorldOverlays(ctx) {
  ctx.save();
  // Enemy HP bars
  for (const e of game.enemies) {
    if (e.dead || e.hp >= e.maxHp || e.hp <= 0) continue;
    const pr = GSplat.project(e.x, e.y - e.h/2 - 8, 6);
    const bw = e.w * pr.s, pct = e.hp / e.maxHp;
    ctx.fillStyle = '#333'; ctx.fillRect(pr.x - bw/2, pr.y, bw, 3.5);
    ctx.fillStyle = pct > 0.5 ? '#44FF44' : pct > 0.25 ? '#FFAA00' : '#FF4444';
    ctx.fillRect(pr.x - bw/2, pr.y, bw * pct, 3.5);
  }
  // Power-up letters
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const pu of game.powerups) {
    const pr = GSplat.project(pu.x, pu.y, 8);
    ctx.fillStyle = '#001133';
    ctx.font = 'bold ' + Math.max(7, Math.round(9 * pr.s)) + 'px Share Tech Mono';
    ctx.fillText(PU_LABEL[pu.type] || '?', pr.x, pr.y);
  }
  ctx.textBaseline = 'alphabetic';
  // Wreck labels + revive rings
  for (const w of game.wrecks) {
    const pr = GSplat.project(w.x, w.y, 3);
    ctx.fillStyle = w.color; ctx.font = '9px Orbitron'; ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, w.life / 60);
    ctx.fillText('P' + w.pid + ' WRECK', pr.x, pr.y - 18 * pr.s);
    if (w.reviveProgress > 0) {
      ctx.strokeStyle = '#FFEEBB'; ctx.lineWidth = 3;
      ctx.shadowBlur = 16; ctx.shadowColor = '#FFEEBB';
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, 22 * pr.s, -Math.PI/2, -Math.PI/2 + (w.reviveProgress/180) * Math.PI*2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
  // Boss HP bar (screen-space, same chrome as classic)
  if (game.boss && !game.boss.dead) {
    const bs = game.boss;
    const bw = W * 0.5, pct = bs.hp / bs.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(W/2 - bw/2, 10, bw, 12);
    ctx.fillStyle = pct > 0.5 ? '#FF4466' : pct > 0.25 ? '#FF8800' : '#FF2200';
    ctx.fillRect(W/2 - bw/2, 10, bw * pct, 12);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(W/2 - bw/2, 10, bw, 12);
    ctx.fillStyle = '#FFF'; ctx.font = '8px Share Tech Mono'; ctx.textAlign = 'center';
    ctx.fillText('BOSS HP', W/2, 20);
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: RENDER — PARTICLES
   Extended from the Phase 1 class: optional trail, gravity, drag, rotation,
   color-over-life, size-over-life, and glow rendering.
   ═══════════════════════════════════════════════════════════════════════════ */
const parseHexRGB = (h) => (typeof h === 'string' && h[0] === '#' && h.length >= 7)
  ? [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255]
  : [1, 1, 1];

class Particle {
  constructor(x,y,vx,vy,color,life,sz,opts) {
    opts = opts || {};
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.z = opts.z || 0; this.vz = opts.vz || 0;   // 3D motion for the splat renderer
    this.color=color; this.life=life; this.maxLife=life; this.sz=sz;
    this.gravity = opts.gravity !== undefined ? opts.gravity : 0.05;
    this.drag    = opts.drag    !== undefined ? opts.drag    : 1.0;
    this.glow    = opts.glow    !== undefined ? opts.glow    : 0;
    this.shape   = opts.shape   || 'circle';                 // 'circle'|'square'|'streak'
    this.colorEnd = opts.colorEnd || null;                   // fade to this color
    this._rgb    = parseHexRGB(color);
    this._rgbEnd = this.colorEnd ? parseHexRGB(this.colorEnd) : null;
    this.trail   = opts.trail || 0;                          // # of trail samples
    this.history = this.trail ? [] : null;
  }
  update() {
    if (this.history) {
      this.history.push(this.x, this.y);
      if (this.history.length > this.trail * 2) this.history.splice(0, 2);
    }
    this.x += this.vx; this.y += this.vy;
    this.z += this.vz; this.vz *= this.drag;
    this.vy += this.gravity;
    this.vx *= this.drag; this.vy *= this.drag;
    this.life--;
  }
  draw(ctx) {
    const a = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = a;
    if (this.glow > 0) { ctx.shadowBlur = this.glow; ctx.shadowColor = this.color; }
    let color = this.color;
    if (this.colorEnd) {
      // lerp rgb
      const lerpHex = (c1, c2, t) => {
        const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
        const [r1,g1,b1] = p(c1), [r2,g2,b2] = p(c2);
        return `rgb(${(r1+(r2-r1)*t)|0},${(g1+(g2-g1)*t)|0},${(b1+(b2-b1)*t)|0})`;
      };
      color = lerpHex(this.color, this.colorEnd, 1 - a);
    }
    if (this.history && this.history.length >= 4) {
      ctx.strokeStyle = color;
      ctx.lineWidth = this.sz * a;
      ctx.beginPath();
      ctx.moveTo(this.history[0], this.history[1]);
      for (let i = 2; i < this.history.length; i += 2) ctx.lineTo(this.history[i], this.history[i+1]);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    }
    ctx.fillStyle = color;
    if (this.shape === 'square') {
      const s = this.sz * a;
      ctx.fillRect(this.x - s, this.y - s, s * 2, s * 2);
    } else if (this.shape === 'streak') {
      const len = Math.hypot(this.vx, this.vy) * 3;
      const ang = Math.atan2(this.vy, this.vx);
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(ang);
      ctx.fillRect(-len, -this.sz * a * 0.5, len, this.sz * a);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.sz * a, 0, Math.PI * 2); ctx.fill();
    }
    if (this.glow > 0) ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

let particles = [];
function explode(x,y,color,count=20,speed=3) {
  const n = Config.get('reducedMotion') ? Math.ceil(count*0.5) : count;
  for(let i=0;i<n;i++) {
    const ang = rnd(0,Math.PI*2);
    const spd = rnd(0.5,speed);
    particles.push(new Particle(x,y,Math.cos(ang)*spd,Math.sin(ang)*spd,color,rnd(22,44),rnd(1.2,4.2), {
      glow: 8, drag: 0.96, gravity: 0.04, colorEnd: '#221100', vz: rnd(-1,1)*spd*0.7,
    }));
  }
  // Add a few fast streak shards
  const shards = Math.ceil(n * 0.2);
  for (let i = 0; i < shards; i++) {
    const ang = rnd(0, Math.PI * 2);
    const spd = rnd(speed, speed * 2);
    particles.push(new Particle(x, y, Math.cos(ang)*spd, Math.sin(ang)*spd, color, rnd(10,18), rnd(1.5,3), {
      shape: 'streak', glow: 10, gravity: 0.0, drag: 0.94, vz: rnd(-1,1)*spd*0.5,
    }));
  }
}
function sparkle(x,y,color,count=8) {
  const n = Config.get('reducedMotion') ? Math.ceil(count*0.5) : count;
  for(let i=0;i<n;i++) {
    const ang = rnd(0,Math.PI*2);
    particles.push(new Particle(x,y,Math.cos(ang)*rnd(1,3),Math.sin(ang)*rnd(1,3),color,rnd(10,20),rnd(1,2), {
      glow: 6, drag: 0.9, vz: rnd(-1.5,1.5),
    }));
  }
}
function thruster(x, y, color) {
  if (Config.get('reducedMotion')) return;
  particles.push(new Particle(x + rnd(-2,2), y, rnd(-0.3, 0.3), rnd(1.5, 3), color, rnd(10, 18), rnd(1.5, 2.5), {
    glow: 8, drag: 0.92, gravity: 0, colorEnd: '#221100', trail: 3, vz: rnd(-0.4, 0.4),
  }));
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: INPUT
   ═══════════════════════════════════════════════════════════════════════════ */
const keys = {};
// Binding capture: when set, the next keydown is recorded as the binding
// for capturingFor = { player:'p1'|'p2', action:'left'|... } and cleared.
let capturingFor = null;
window.addEventListener('keydown', e => {
  if (capturingFor) {
    e.preventDefault();
    // Ignore key autorepeat (e.g. Enter held down from the confirm press).
    if (e.repeat) return;
    if (e.code !== 'Escape') {
      const bindings = JSON.parse(JSON.stringify(getBindings()));
      bindings[capturingFor.player][capturingFor.action] = [e.code];
      Config.set('bindings', bindings);
      Toasts.push('BOUND ' + capturingFor.action.toUpperCase() + ' → ' + e.code, '#88CCFF');
    }
    capturingFor = null;
    return;
  }
  keys[e.code] = true; e.preventDefault();
});
window.addEventListener('keyup',   e => { keys[e.code]=false; });

// ── Gamepad (standard HTML5 Gamepad API; no vendor inline needed) ─────────
const Gamepad = (() => {
  let pads = [];
  function poll() {
    pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
  }
  function state(slot) {
    const p = pads[slot];
    if (!p) return null;
    const dz = 0.18;
    const axX = Math.abs(p.axes[0]) > dz ? p.axes[0] : 0;
    const axY = Math.abs(p.axes[1]) > dz ? p.axes[1] : 0;
    const b = p.buttons;
    const dl = b[14] && b[14].pressed, dr = b[15] && b[15].pressed;
    const du = b[12] && b[12].pressed, dd = b[13] && b[13].pressed;
    return {
      dx: axX + (dr?1:0) - (dl?1:0),
      dy: axY + (dd?1:0) - (du?1:0),
      fire: !!((b[0]&&b[0].pressed) || (b[7]&&b[7].pressed)),
      bomb: !!((b[1]&&b[1].pressed) || (b[2]&&b[2].pressed)),
      start: !!(b[9] && b[9].pressed),
    };
  }
  function rumble(slot, intensity, ms) {
    const p = pads[slot];
    if (!p || !p.vibrationActuator) return;
    try {
      p.vibrationActuator.playEffect('dual-rumble', {
        duration: ms, startDelay: 0,
        strongMagnitude: intensity,
        weakMagnitude: intensity * 0.7,
      });
    } catch (_) {}
  }
  function connectedCount() { return pads.length; }
  return { poll, state, rumble, connectedCount };
})();
window.addEventListener('gamepadconnected',    () => { Toasts.push('GAMEPAD CONNECTED', '#44FF88'); });
window.addEventListener('gamepaddisconnected', () => { Toasts.push('GAMEPAD DISCONNECTED', '#FFAA88'); });

// ── Key bindings (overlay onto defaults, persisted via Config) ────────────
const DEFAULT_BINDINGS = Object.freeze({
  p1: { left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], up:['KeyW','ArrowUp'], down:['KeyS','ArrowDown'], fire:['Space','KeyZ'], bomb:['KeyX'] },
  p2: { left:['KeyJ','Numpad4'],   right:['KeyL','Numpad6'],    up:['KeyI','Numpad8'], down:['KeyK','Numpad5'],   fire:['Enter','NumpadEnter','KeyM'], bomb:['KeyN'] },
});
function getBindings() {
  const saved = Config.get('bindings');
  return saved && saved.p1 && saved.p2 ? saved : DEFAULT_BINDINGS;
}
function anyKey(codes) { return codes.some(c => keys[c]); }

// Touch input state
const touch = {
  p1: { dx:0, dy:0, fire:false, id:null, ox:0, oy:0 },
  p2: { dx:0, dy:0, fire:false, id:null, ox:0, oy:0 }
};

function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}

const mc = document.getElementById('mobile-controls');
mc.addEventListener('touchstart', e => {
  Array.from(e.changedTouches).forEach(t => {
    const pos = getTouchPos(t);
    const side = pos.x < W/2 ? 'p1' : 'p2';
    if(!touch[side].id) {
      touch[side].id = t.identifier;
      touch[side].ox = pos.x; touch[side].oy = pos.y;
      touch[side].dx=0; touch[side].dy=0; touch[side].fire=false;
    }
  });
},{passive:false});

mc.addEventListener('touchmove', e => {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => {
    const pos = getTouchPos(t);
    ['p1','p2'].forEach(p => {
      if(touch[p].id === t.identifier) {
        touch[p].dx = clamp((pos.x - touch[p].ox)/40, -1, 1);
        touch[p].dy = clamp((pos.y - touch[p].oy)/40, -1, 1);
      }
    });
  });
},{passive:false});

['touchend','touchcancel'].forEach(ev => mc.addEventListener(ev, e => {
  Array.from(e.changedTouches).forEach(t => {
    ['p1','p2'].forEach(p => {
      if(touch[p].id === t.identifier) {
        touch[p].id=null; touch[p].dx=0; touch[p].dy=0;
      }
    });
  });
}));

// Fire buttons
document.getElementById('fire1-btn').addEventListener('touchstart', e => { touch.p1.fire=true; e.preventDefault(); });
document.getElementById('fire1-btn').addEventListener('touchend', e => { touch.p1.fire=false; });
document.getElementById('fire2-btn').addEventListener('touchstart', e => { touch.p2.fire=true; e.preventDefault(); });
document.getElementById('fire2-btn').addEventListener('touchend', e => { touch.p2.fire=false; });

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENTITIES — BULLET
   ═══════════════════════════════════════════════════════════════════════════ */
class Bullet {
  constructor(x,y,vx,vy,color,dmg,sz,isPlayer) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.dmg=dmg; this.sz=sz; this.isPlayer=isPlayer; this.dead=false;
  }
  update() {
    if (this._px === undefined) { this._px = this.x; this._py = this.y; }
    else { this._px = this.x; this._py = this.y; }
    if (this.homing) {
      // Find nearest live enemy; steer vx,vy toward it (bounded turn rate).
      let best = null, bestD = 260;
      const targets = game.enemies.filter(e => !e.dead);
      if (game.boss && !game.boss.dead && !game.boss.entering) targets.push(game.boss);
      for (const t of targets) {
        const d = Math.hypot(t.x - this.x, t.y - this.y);
        if (d < bestD) { bestD = d; best = t; }
      }
      if (best) {
        const tx = best.x - this.x, ty = best.y - this.y;
        const td = Math.hypot(tx, ty) || 1;
        const desiredVx = tx / td * 6, desiredVy = ty / td * 6;
        this.vx += (desiredVx - this.vx) * 0.14;
        this.vy += (desiredVy - this.vy) * 0.14;
      } else {
        this.vy = Math.min(this.vy, -6);
      }
    }
    this.x+=this.vx; this.y+=this.vy;
    if(this.y<-20||this.y>H+20||this.x<-20||this.x>W+20) this.dead=true;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowBlur=12; ctx.shadowColor=this.color;
    // Trail line
    if (this._px !== undefined) {
      ctx.strokeStyle = this.color;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = this.sz * 0.9;
      ctx.beginPath();
      ctx.moveTo(this._px, this._py);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.sz, this.sz*2.5, 0, 0, Math.PI*2);
    ctx.fill();
    // bright core
    ctx.fillStyle = '#FFFFFF';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.sz*0.35, this.sz*1.2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENTITIES — POWER-UP
   ═══════════════════════════════════════════════════════════════════════════ */
// SHOT raises weapon level 1..5; WEAPON rolls a new weapon type.
const PU_TYPES = ['SHOT','SPEED','SHIELD','BOMB','WEAPON'];
const PU_LABEL = { SHOT:'S', SPEED:'P', SHIELD:'H', BOMB:'B', WEAPON:'W' };
class PowerUp {
  constructor(x,y,type) {
    this.x=x; this.y=y; this.type=type; this.dead=false; this.t=0;
    this.colors = { SHOT:'#FF8800', SPEED:'#00FFFF', SHIELD:'#4488FF', BOMB:'#FF4466', WEAPON:'#FF88EE' };
  }
  update() { this.y += 1.2; this.t++; if(this.y>H+20) this.dead=true; }
  draw(ctx) {
    const c = this.colors[this.type];
    const pulse = Math.sin(this.t*0.15)*3;
    ctx.save();
    ctx.shadowBlur=14+pulse; ctx.shadowColor=c;
    ctx.strokeStyle=c; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(this.x,this.y,12+pulse,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=c; ctx.font='bold 9px Share Tech Mono'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(PU_LABEL[this.type] || '?', this.x, this.y);
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENTITIES — PLAYER
   ═══════════════════════════════════════════════════════════════════════════ */
class Player {
  constructor(x,y,pid,color) {
    this.x=x; this.y=y; this.pid=pid; this.color=color;
    this.w=24; this.h=28; this.dead=false; this.invTime=0;
    this.shotLevel=1; this.speed=3.2; this.hasShield=false; this.shieldTime=0;
    this.bombs=3; this.fireTimer=0; this.fireRate=8;
    this.weapon='STANDARD';    // 'STANDARD' | 'SPREAD' | 'LASER' | 'HOMING'
    this.score=0; this.t=0; this.thrusterT=0;
    this.lives = DIFF_CFG[game.diff].lives;
    this.dying=0; this.respawnTimer=0; this.active=true;
  }
  getInput() {
    const bindings = getBindings();
    const slot = this.pid === 1 ? 'p1' : 'p2';
    const map = bindings[slot];
    let dx=0, dy=0, fire=false, bomb=false;
    if (anyKey(map.left))  dx -= 1;
    if (anyKey(map.right)) dx += 1;
    if (anyKey(map.up))    dy -= 1;
    if (anyKey(map.down))  dy += 1;
    if (anyKey(map.fire))  fire = true;
    if (anyKey(map.bomb))  bomb = true;
    // Touch (existing zones)
    const tp = this.pid === 1 ? touch.p1 : touch.p2;
    dx += tp.dx; dy += tp.dy;
    if (tp.fire) fire = true;
    // Gamepad (pad 0 = P1, pad 1 = P2)
    const pad = Gamepad.state(this.pid - 1);
    if (pad) {
      dx += pad.dx; dy += pad.dy;
      if (pad.fire) fire = true;
      if (pad.bomb) bomb = true;
    }
    return {dx:clamp(dx,-1,1), dy:clamp(dy,-1,1), fire, bomb};
  }
  update(bullets) {
    this.t++;
    if(this.dying>0) { this.dying--; return; }
    if(this.respawnTimer>0) { this.respawnTimer--; if(this.respawnTimer===0) { this.invTime=120; } return; }
    if(this.invTime>0) this.invTime--;
    if(this.hasShield) { this.shieldTime--; if(this.shieldTime<=0) this.hasShield=false; }
    const inp = this.getInput();
    this.x = clamp(this.x + inp.dx*this.speed, this.w/2, W-this.w/2);
    this.y = clamp(this.y + inp.dy*this.speed, this.h/2, H-this.h/2);
    this.fireTimer++;
    if(inp.fire && this.fireTimer >= this.fireRate) {
      this.fireTimer=0; this.shoot(bullets);
    }
    if(inp.bomb && this.bombs>0) { this.useBomb(bullets); this.bombs=Math.max(0,this.bombs-1); }
    this.thrusterT++;
    // thruster particles (streaked, trail-enabled)
    if(this.t%2===0) thruster(this.x, this.y+this.h/2, this.pid===1?'#FFAA33':'#44AAFF');
  }
  shoot(bullets) {
    const spd = -9;
    const c = this.pid===1 ? '#FFE066' : '#66EEFF';
    const y = this.y - this.h/2;
    const lvl = this.shotLevel;
    const push = (bx,by,vx,vy,dmg,sz,opts) => bullets.push(Object.assign(new Bullet(bx,by,vx,vy,c,dmg,sz,true), opts||{}));
    if (this.weapon === 'SPREAD') {
      const fan = 3 + lvl; // 4..8 bullets
      const angSpread = 0.55 + lvl*0.04;
      for (let i = 0; i < fan; i++) {
        const t = fan === 1 ? 0 : (i/(fan-1) - 0.5) * 2;
        const ang = -Math.PI/2 + t * angSpread * 0.5;
        push(this.x, y, Math.cos(ang)*9, Math.sin(ang)*9, 1, 2.2);
      }
      Audio.play('shoot');
    } else if (this.weapon === 'LASER') {
      // Fast piercing vertical beams
      push(this.x, y, 0, -14, 1.8, 2.4, { piercing: 2 + lvl });
      if (lvl >= 2) { push(this.x - 12, y, 0, -14, 1.2, 2, { piercing: 1 + lvl }); push(this.x + 12, y, 0, -14, 1.2, 2, { piercing: 1 + lvl }); }
      if (lvl >= 4) { push(this.x - 22, y, 0, -14, 1.0, 1.8, { piercing: lvl }); push(this.x + 22, y, 0, -14, 1.0, 1.8, { piercing: lvl }); }
      Audio.play('shoot_powered');
    } else if (this.weapon === 'HOMING') {
      const count = Math.min(5, 1 + Math.floor(lvl/1));
      for (let i = 0; i < count; i++) {
        const ox = (i - (count-1)/2) * 8;
        push(this.x + ox, y, rnd(-1.5,1.5), -6, 1.2, 2, { homing: true });
      }
      Audio.play('shoot');
    } else {
      // STANDARD
      if (lvl === 1) {
        push(this.x, y, 0, spd, 1, 2.5);
      } else if (lvl === 2) {
        push(this.x - 7, y, 0, spd, 1, 2.5); push(this.x + 7, y, 0, spd, 1, 2.5);
      } else if (lvl === 3) {
        push(this.x, y, 0, spd, 1.5, 2.5);
        push(this.x - 10, y, -0.5, spd, 1, 2); push(this.x + 10, y, 0.5, spd, 1, 2);
      } else if (lvl === 4) {
        push(this.x - 6, y, 0, spd, 1.5, 2.5); push(this.x + 6, y, 0, spd, 1.5, 2.5);
        push(this.x - 14, y, -0.8, spd, 1, 2);  push(this.x + 14, y, 0.8, spd, 1, 2);
      } else { // 5
        push(this.x, y, 0, spd, 2, 3);
        push(this.x - 8, y, -0.3, spd, 1.5, 2.5); push(this.x + 8, y, 0.3, spd, 1.5, 2.5);
        push(this.x - 16, y, -1, spd, 1, 2);      push(this.x + 16, y, 1, spd, 1, 2);
      }
      Audio.play(lvl >= 3 ? 'shoot_powered' : 'shoot');
    }
  }
  useBomb(bullets) {
    explode(this.x, this.y, this.color, 60, 6);
    // screen flash
    game.screenFlash = 10;
    Audio.play('bomb');
    Audio.duck(0.3, 600);
    Camera.shake(0.9, 450);
    Camera.flash('#FFEEBB', 180);
    CRT.pulseAberration(2.5, 600);
    Gamepad.rumble(this.pid - 1, 0.9, 300);
    // kill all enemy bullets
    game.bullets = game.bullets.filter(b => b.isPlayer);
    // damage all enemies
    game.enemies.forEach(e => { e.hp -= 5; if(e.hp<=0) e.hp=0; });
  }
  takeDamage() {
    if(this.invTime>0||this.hasShield||this.dying>0) return;
    this.lives--;
    this.invTime=0;
    this.dying=60;
    explode(this.x, this.y, this.color, 60, 4);
    Audio.play('hit_player');
    Audio.play('explode_big');
    Audio.duck(0.4, 500);
    Camera.shake(1.0, 500);
    Camera.flash('#FF4466', 300);
    Camera.slowMo(0.35, 280);
    CRT.pulseAberration(2.0, 500);
    Gamepad.rumble(this.pid - 1, 1.0, 400);
    Combo.reset();
    if(this.lives<=0) {
      this.active=false;
      this.dead=true;
      // 2P: drop a wreck so the other player can revive us.
      if (game.mode === 2 && game.players.length > 1) {
        const other = game.players.find(p => p.pid !== this.pid && p.active);
        if (other) { game.wrecks.push(new Wreck(this.x, this.y, this.pid, this.color)); }
      }
    } else {
      this.respawnTimer=90;
      this.x = this.pid===1 ? W*0.35 : W*0.65;
      this.y = H-80;
    }
  }
  draw(ctx) {
    if(this.dying>0) {
      const a = this.dying/60;
      ctx.globalAlpha = a;
    }
    if(this.respawnTimer>0) { ctx.globalAlpha=0; }
    if(this.invTime>0 && Math.floor(this.invTime/5)%2===0) { ctx.globalAlpha=0.3; }
    // Thruster flame
    if(this.dying===0 && this.respawnTimer===0) {
      const flameLen = 10+Math.sin(this.t*0.4)*5;
      const grad = ctx.createLinearGradient(this.x,this.y+this.h/2,this.x,this.y+this.h/2+flameLen);
      grad.addColorStop(0, this.pid===1?'#FFA000':'#0088FF');
      grad.addColorStop(1,'transparent');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.ellipse(this.x,this.y+this.h/2+flameLen/2,5,flameLen/2,0,0,Math.PI*2); ctx.fill();
    }
    // Ship body
    ctx.save();
    ctx.shadowBlur=16; ctx.shadowColor=this.color;
    ctx.fillStyle=this.color;
    // Main body
    ctx.beginPath();
    ctx.moveTo(this.x, this.y-this.h/2);
    ctx.lineTo(this.x-this.w/2, this.y+this.h/2);
    ctx.lineTo(this.x-this.w/4, this.y+this.h/4);
    ctx.lineTo(this.x, this.y+this.h/3);
    ctx.lineTo(this.x+this.w/4, this.y+this.h/4);
    ctx.lineTo(this.x+this.w/2, this.y+this.h/2);
    ctx.closePath(); ctx.fill();
    // Cockpit
    ctx.fillStyle='#001133';
    ctx.beginPath(); ctx.ellipse(this.x, this.y-this.h/8, 5, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(100,200,255,0.8)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y-this.h/8, 3, 5, 0, 0, Math.PI*2); ctx.fill();
    // Shield
    if(this.hasShield) {
      ctx.strokeStyle='rgba(68,136,255,0.8)'; ctx.lineWidth=2; ctx.shadowBlur=20; ctx.shadowColor='#4488FF';
      ctx.beginPath(); ctx.arc(this.x,this.y,this.h*0.7,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENTITIES — WRECK (2P revive marker)
   When a co-op player runs out of lives, their wreck persists for 15s.
   The surviving teammate can stand over it for 3s to revive them.
   ═══════════════════════════════════════════════════════════════════════════ */
class Wreck {
  constructor(x, y, pid, color) {
    this.x=x; this.y=y; this.pid=pid; this.color=color;
    this.life=900;          // 15s at 60fps
    this.reviveProgress=0;  // 0..180 (3s)
    this.dead=false;
    this.t=0;
  }
  update(players) {
    this.t++;
    this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    this.y += 0.2;
    // Another player standing close?
    const savior = players.find(p => p.active && p.pid !== this.pid && !p.dying && !p.respawnTimer);
    if (savior && dist(savior, this) < 32) {
      this.reviveProgress = Math.min(180, this.reviveProgress + 1);
      if (this.t % 6 === 0) sparkle(this.x, this.y, this.color, 2);
      if (this.reviveProgress >= 180) {
        const fallen = players.find(p => p.pid === this.pid);
        if (fallen) {
          fallen.active = true;
          fallen.lives  = 1;
          fallen.dead   = false;
          fallen.invTime = 120;
          fallen.x = this.x; fallen.y = this.y;
          fallen.shotLevel = Math.max(1, (fallen.shotLevel|0) - 1);
          Audio.play('powerup');
          Toasts.push('P' + this.pid + ' REVIVED!', this.color);
        }
        this.dead = true;
      }
    } else {
      this.reviveProgress = Math.max(0, this.reviveProgress - 2);
    }
  }
  draw(ctx) {
    ctx.save();
    const blink = Math.sin(this.t * 0.2) * 0.3 + 0.7;
    ctx.shadowBlur = 12; ctx.shadowColor = this.color;
    ctx.strokeStyle = this.color; ctx.lineWidth = 2;
    ctx.globalAlpha = Math.min(1, this.life / 60) * blink;
    // Broken ship silhouette
    ctx.beginPath();
    ctx.moveTo(this.x - 12, this.y - 4); ctx.lineTo(this.x + 8, this.y - 10);
    ctx.lineTo(this.x + 12, this.y + 6); ctx.lineTo(this.x - 6, this.y + 8);
    ctx.closePath(); ctx.stroke();
    // Label
    ctx.globalAlpha = 1;
    ctx.fillStyle = this.color; ctx.font = '9px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText('P' + this.pid + ' WRECK', this.x, this.y - 16);
    // Revive progress ring
    if (this.reviveProgress > 0) {
      ctx.strokeStyle = '#FFEEBB'; ctx.lineWidth = 3; ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 22, -Math.PI/2, -Math.PI/2 + (this.reviveProgress/180) * Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENTITIES — ENEMY
   ═══════════════════════════════════════════════════════════════════════════ */
class Enemy {
  constructor(x,y,type,diff) {
    this.x=x; this.y=y; this.type=type; this.diff=diff;
    this.dead=false; this.t=0; this.fireTimer=0;
    this.vx=0; this.vy=0;
    const dc = DIFF_CFG[diff];
    switch(type) {
      case 'basic':  this.w=22;this.h=20;this.hp=2; this.maxHp=2; this.pts=100; this.color='#FF6633'; this.vy=0.8*dc.enemySpd; break;
      case 'weaver': this.w=20;this.h=18;this.hp=3; this.maxHp=3; this.pts=150; this.color='#FF33AA'; this.vy=0.9*dc.enemySpd; break;
