      case 'bomber': this.w=32;this.h=28;this.hp=6; this.maxHp=6; this.pts=300; this.color='#AA44FF'; this.vy=0.5*dc.enemySpd; break;
      case 'kamikaze':this.w=18;this.h=16;this.hp=1;this.maxHp=1;this.pts=200; this.color='#FFAA00'; this.vy=1.5*dc.enemySpd; break;
      case 'elite':  this.w=26;this.h=24;this.hp=8; this.maxHp=8; this.pts=400; this.color='#00FFAA'; this.vy=1.0*dc.enemySpd; break;
    }
    this.fireRate = Math.max(40, 100/dc.fireRate);
    this.initX=x; this.initY=y;
  }
  update(bullets, players) {
    this.t++;
    this.fireTimer++;
    const dc = DIFF_CFG[this.diff];
    switch(this.type) {
      case 'basic': this.y+=this.vy; break;
      case 'weaver': this.x=this.initX+Math.sin(this.t*0.04)*80; this.y+=this.vy; break;
      case 'bomber': this.y+=this.vy; break;
      case 'kamikaze': {
        const tgt = this.getNearestPlayer(players);
        if(tgt) {
          const dx=tgt.x-this.x, dy=tgt.y-this.y, d=Math.hypot(dx,dy)||1;
          this.x+=dx/d*this.vy*1.8; this.y+=dy/d*this.vy*1.8;
        } else { this.y+=this.vy; }
        break;
      }
      case 'elite': this.x=this.initX+Math.sin(this.t*0.06)*60; this.y+=this.vy; break;
    }
    if(this.y > H+50) this.dead=true;
    // Shooting
    if(this.type!=='kamikaze' && this.fireTimer>=this.fireRate) {
      this.fireTimer=0; this.shoot(bullets, players);
    }
  }
  getNearestPlayer(players) {
    const alive = players.filter(p=>p.active&&!p.dying&&p.respawnTimer===0);
    if(!alive.length) return null;
    return alive.reduce((a,b)=>dist(this,a)<dist(this,b)?a:b);
  }
  shoot(bullets, players) {
    const tgt = this.getNearestPlayer(players);
    const c = '#FF3333';
    if(this.type==='bomber') {
      for(let i=-2;i<=2;i++) bullets.push(new Bullet(this.x,this.y+this.h/2,i*0.8,3,c,1,3,false));
    } else if(this.type==='elite') {
      const dx=tgt?(tgt.x-this.x):0, dy=tgt?(tgt.y-this.y):1, d=Math.hypot(dx,dy)||1;
      bullets.push(new Bullet(this.x,this.y+this.h/2,dx/d*3,dy/d*3,c,1,2.5,false));
      bullets.push(new Bullet(this.x,this.y+this.h/2,-dx/d*3+1.5,dy/d*3,c,1,2.5,false));
    } else if(tgt) {
      const dx=tgt.x-this.x, dy=tgt.y-this.y, d=Math.hypot(dx,dy)||1;
      bullets.push(new Bullet(this.x,this.y+this.h/2,dx/d*3,dy/d*3,c,1,2,false));
    }
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    sparkle(this.x,this.y,this.color,4);
    Audio.play('hit_enemy');
    if(this.hp<=0) {
      this.dead=true;
      explode(this.x,this.y,this.color,36,3.5);
      Audio.play('explode_small');
      Camera.shake(0.2, 120);
      return true;
    }
    return false;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowBlur=10; ctx.shadowColor=this.color;
    ctx.fillStyle=this.color;
    switch(this.type) {
      case 'basic': {
        ctx.beginPath();
        ctx.moveTo(this.x,this.y+this.h/2);
        ctx.lineTo(this.x-this.w/2,this.y-this.h/2);
        ctx.lineTo(this.x+this.w/2,this.y-this.h/2);
        ctx.closePath(); ctx.fill(); break;
      }
      case 'weaver': {
        ctx.beginPath();
        ctx.moveTo(this.x,this.y+this.h/2);
        ctx.lineTo(this.x-this.w/2,this.y-this.h/4);
        ctx.lineTo(this.x-this.w/4,this.y-this.h/2);
        ctx.lineTo(this.x+this.w/4,this.y-this.h/2);
        ctx.lineTo(this.x+this.w/2,this.y-this.h/4);
        ctx.closePath(); ctx.fill(); break;
      }
      case 'bomber': {
        ctx.beginPath();
        ctx.ellipse(this.x,this.y,this.w/2,this.h/2,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#660044';
        ctx.beginPath(); ctx.ellipse(this.x,this.y,this.w/4,this.h/3,0,0,Math.PI*2); ctx.fill(); break;
      }
      case 'kamikaze': {
        ctx.beginPath();
        ctx.moveTo(this.x,this.y+this.h/2);
        ctx.lineTo(this.x-this.w/3,this.y-this.h/2);
        ctx.lineTo(this.x,this.y-this.h/4);
        ctx.lineTo(this.x+this.w/3,this.y-this.h/2);
        ctx.closePath(); ctx.fill(); break;
      }
      case 'elite': {
        const s = this.t*0.03;
        ctx.beginPath();
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3+s;
          ctx[i===0?'moveTo':'lineTo'](this.x+Math.cos(a)*this.w/2,this.y+Math.sin(a)*this.h/2);
        }
        ctx.closePath(); ctx.fill(); break;
      }
    }
    // HP bar
    if(this.hp<this.maxHp && this.hp>0) {
      const bw=this.w; const pct=this.hp/this.maxHp;
      ctx.fillStyle='#333'; ctx.fillRect(this.x-bw/2,this.y-this.h/2-8,bw,4);
      ctx.fillStyle=pct>0.5?'#44FF44':pct>0.25?'#FFAA00':'#FF4444';
      ctx.fillRect(this.x-bw/2,this.y-this.h/2-8,bw*pct,4);
    }
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENTITIES — BOSS
   ═══════════════════════════════════════════════════════════════════════════ */
class Boss {
  constructor(level, diff) {
    this.x=W/2; this.y=-80; this.targetY=110; this.diff=diff;
    this.w=80; this.h=60; this.t=0; this.dead=false; this.phase=0;
    const dc=DIFF_CFG[diff];
    const base = [500,800,1200,1600,2200,3000][level-1]||1000;
    this.maxHp = Math.floor(base*dc.bossHp);
    this.hp=this.maxHp;
    this.pts=base*10;
    this.fireTimer=0;
    this.fireRate=Math.max(20,60/dc.fireRate);
    this.colors=['#FF4466','#AA00FF','#FF8800','#00FFAA','#FF2200','#FFFFFF'];
    this.color=this.colors[level-1]||'#FF4466';
    this.vx=1.2*dc.enemySpd; this.vy=0;
    this.entering=true;
    this.armAngle=0; this.shieldArc=0;
  }
  update(bullets, players) {
    this.t++;
    this.armAngle += 0.04;
    if(this.entering) { this.y=lerp(this.y,this.targetY,0.02); if(Math.abs(this.y-this.targetY)<1){this.y=this.targetY;this.entering=false;} return; }
    // Phase transitions
    const hpPct = this.hp/this.maxHp;
    if(hpPct<0.5&&this.phase===0) { this.phase=1; this.onPhaseChange(); }
    if(hpPct<0.25&&this.phase===1) { this.phase=2; this.onPhaseChange(); }
    // Movement
    this.x += this.vx;
    if(this.x>W-this.w/2||this.x<this.w/2) this.vx*=-1;
    if(this.phase>=1) { this.y=this.targetY+Math.sin(this.t*0.02)*40; }
    this.fireTimer++;
    const rate = this.phase===2?this.fireRate*0.5:this.fireRate;
    if(this.fireTimer>=rate) { this.fireTimer=0; this.shoot(bullets,players); }
    // Shield arc rotation for phase 2
    if(this.phase>=2) this.shieldArc += 0.06;
  }
  shoot(bullets, players) {
    const tgt = players.filter(p=>p.active&&!p.dying&&p.respawnTimer===0);
    const c='#FF2222';
    if(this.phase===0) {
      // aimed shots
      tgt.forEach(t=>{ const dx=t.x-this.x,dy=t.y-this.y,d=Math.hypot(dx,dy)||1;
        bullets.push(new Bullet(this.x,this.y+this.h/2,dx/d*4,dy/d*4,c,1,3,false)); });
    } else if(this.phase===1) {
      // spread
      for(let i=-3;i<=3;i++) bullets.push(new Bullet(this.x,this.y+this.h/2,i*1.2,4,c,1,3,false));
      if(tgt[0]){ const dx=tgt[0].x-this.x,dy=tgt[0].y-this.y,d=Math.hypot(dx,dy)||1;
        bullets.push(new Bullet(this.x,this.y+this.h/2,dx/d*5,dy/d*5,'#FF8800',2,4,false));}
    } else {
      // radial burst
      for(let i=0;i<12;i++){const a=i*Math.PI/6+this.t*0.01;
        bullets.push(new Bullet(this.x,this.y,Math.cos(a)*4,Math.sin(a)*4,'#FF0044',1,3,false));}
      tgt.forEach(t=>{ const dx=t.x-this.x,dy=t.y-this.y,d=Math.hypot(dx,dy)||1;
        bullets.push(new Bullet(this.x,this.y,dx/d*6,dy/d*6,'#FF8800',2,5,false)); });
    }
  }
  onPhaseChange() {
    explode(this.x, this.y, this.color, 40, 4);
    Camera.shake(0.5, 260);
    CRT.pulseAberration(1.2, 350);
    Audio.play('boss_warn');
  }
  takeDamage(dmg) {
    if(this.entering) return false;
    this.hp-=dmg; sparkle(this.x,this.y,this.color,3);
    Audio.play('hit_enemy');
    if(this.hp<=0){
      this.dead=true;
      explode(this.x,this.y,this.color,120,6);
      Audio.play('explode_big');
      Audio.duck(0.3, 700);
      Camera.shake(1.0, 600);
      Camera.flash('#FFEEBB', 220);
      Camera.slowMo(0.25, 450);
      CRT.pulseAberration(3.0, 700);
      Confetti.burst(this.x, this.y, ['#FFB800','#FF4466','#44FF88','#44AAFF','#FFEEBB'], 140);
      return true;
    }
    return false;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowBlur=20; ctx.shadowColor=this.color;
    // Main hull
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y-this.h/2);
    ctx.lineTo(this.x-this.w/2,this.y-this.h/4);
    ctx.lineTo(this.x-this.w/2,this.y+this.h/3);
    ctx.lineTo(this.x-this.w/4,this.y+this.h/2);
    ctx.lineTo(this.x+this.w/4,this.y+this.h/2);
    ctx.lineTo(this.x+this.w/2,this.y+this.h/3);
    ctx.lineTo(this.x+this.w/2,this.y-this.h/4);
    ctx.closePath(); ctx.fill();
    // Core
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(this.x,this.y,this.w/4,this.h/4,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=30; ctx.shadowColor='#FFFFFF';
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(this.x,this.y,this.w/5,this.h/5,0,0,Math.PI*2); ctx.stroke();
    // Arms
    for(let i=0;i<4;i++){
      const a=this.armAngle+i*Math.PI/2;
      ctx.strokeStyle=this.color; ctx.lineWidth=4; ctx.shadowBlur=15;
      ctx.beginPath(); ctx.moveTo(this.x,this.y);
      ctx.lineTo(this.x+Math.cos(a)*this.w*0.7,this.y+Math.sin(a)*this.h*0.7); ctx.stroke();
      ctx.fillStyle=this.color;
      ctx.beginPath(); ctx.arc(this.x+Math.cos(a)*this.w*0.7,this.y+Math.sin(a)*this.h*0.7,5,0,Math.PI*2); ctx.fill();
    }
    // Phase 2 shield
    if(this.phase>=2) {
      ctx.strokeStyle='rgba(255,100,50,0.6)'; ctx.lineWidth=3; ctx.shadowBlur=15; ctx.shadowColor='#FF6432';
      ctx.beginPath(); ctx.arc(this.x,this.y,this.w*0.9,this.shieldArc,this.shieldArc+Math.PI*1.5); ctx.stroke();
    }
    // HP bar
    const bw=W*0.5; const pct=this.hp/this.maxHp;
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(W/2-bw/2,10,bw,12);
    ctx.fillStyle=pct>0.5?'#FF4466':pct>0.25?'#FF8800':'#FF2200';
    ctx.fillRect(W/2-bw/2,10,bw*pct,12);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.strokeRect(W/2-bw/2,10,bw,12);
    ctx.fillStyle='#FFF'; ctx.font='8px Share Tech Mono'; ctx.textAlign='center';
    ctx.fillText('BOSS HP',W/2,20);
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: LEVEL DEFINITIONS
   ═══════════════════════════════════════════════════════════════════════════ */
// Returns wave config for given difficulty (0-2) and level (1-6)
function getLevelWaves(diff, level) {
  const d = DIFF_CFG[diff];
  const baseCount = [4,6,8,10,12,16][level-1];
  const waves = [];
  // Wave 1: basic enemies
  const w1 = [];
  for(let i=0;i<baseCount;i++) w1.push({type:'basic', x:rnd(40,W-40), y:rnd(-200,-50+i*(-30))});
  waves.push(w1);
  // Wave 2: weavers
  if(level>=2) {
    const w2=[]; const cnt=Math.floor(baseCount*0.7);
    for(let i=0;i<cnt;i++) w2.push({type:'weaver',x:rnd(40,W-40),y:rnd(-200,-50+i*(-30))});
    waves.push(w2);
  }
  // Wave 3: mixed
  if(level>=3) {
    const w3=[];
    for(let i=0;i<Math.floor(baseCount/2);i++) w3.push({type:'basic',x:rnd(40,W-40),y:-100-i*40});
    for(let i=0;i<3;i++) w3.push({type:'kamikaze',x:rnd(60,W-60),y:-200-i*60});
    waves.push(w3);
  }
  // Wave 4: bombers + elites
  if(level>=4) {
    const w4=[];
    for(let i=0;i<3;i++) w4.push({type:'bomber',x:80+i*120,y:-100-i*50});
    if(diff>=1) for(let i=0;i<4;i++) w4.push({type:'weaver',x:rnd(40,W-40),y:-250-i*40});
    waves.push(w4);
  }
  // Wave 5: elites
  if(level>=5) {
    const w5=[];
    const cnt=Math.floor(baseCount*0.5);
    const type = diff>=2?'elite':'weaver';
    for(let i=0;i<cnt;i++) w5.push({type,x:rnd(40,W-40),y:-100-i*50});
    waves.push(w5);
  }
  // Wave 6: all types
  if(level>=6) {
    const w6=[];
    for(let i=0;i<6;i++) w6.push({type:'basic',x:rnd(40,W-40),y:-100-i*40});
    for(let i=0;i<4;i++) w6.push({type:'kamikaze',x:rnd(40,W-40),y:-300-i*50});
    for(let i=0;i<2;i++) w6.push({type:'elite',x:rnd(60,W-60),y:-500-i*80});
    waves.push(w6);
  }
  return waves;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: UI — TOAST QUEUE
   Replaces the single flash-message with a stack; each toast slides in,
   holds, then slides out.
   ═══════════════════════════════════════════════════════════════════════════ */
const Toasts = (() => {
  const queue = [];
  function push(msg, color) {
    queue.push({ msg, color: color || '#FFB800', t: 0, ttl: 90 });
    if (queue.length > 4) queue.shift();
  }
  function update() {
    for (let i = queue.length - 1; i >= 0; i--) {
      queue[i].t++;
      if (queue[i].t > queue[i].ttl) queue.splice(i, 1);
    }
  }
  function draw(ctx) {
    let y = 50;
    for (const t of queue) {
      const inT  = Math.min(1, t.t / 10);
      const outT = Math.min(1, (t.ttl - t.t) / 15);
      const a = Math.min(inT, outT);
      const slide = (1 - inT) * 24;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.shadowBlur = 14; ctx.shadowColor = t.color;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      const text = t.msg;
      ctx.font = 'bold 13px Orbitron';
      const tw = ctx.measureText(text).width + 28;
      ctx.fillRect(W/2 - tw/2 + slide, y - 14, tw, 22);
      ctx.fillStyle = t.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, W/2 + slide, y - 3);
      ctx.restore();
      y += 28;
    }
  }
  return { push, update, draw };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: GAMEPLAY — COMBO SYSTEM
   Chain kills within a short window to raise a score multiplier up to x4.
   ═══════════════════════════════════════════════════════════════════════════ */
const Combo = (() => {
  const WINDOW = 120;  // frames of grace between kills (~2s at 60fps)
  let count = 0;
  let timer = 0;
  let multiplier = 1;
  let lastTier = 1;
  function onKill() {
    count++;
    timer = WINDOW;
    multiplier = Math.min(4, 1 + Math.floor(count / 4) * 0.5);
    const tier = Math.floor(multiplier * 2); // 2, 3, 4, 5, 6, 7, 8 (×1 .. ×4)
    if (tier > lastTier) {
      lastTier = tier;
      Toasts.push('COMBO x' + multiplier.toFixed(1) + '!', '#FF88EE');
    }
  }
  function tick() {
    if (timer > 0) timer--;
    if (timer === 0 && count > 0) { reset(); }
  }
  function reset() { count = 0; multiplier = 1; lastTier = 1; }
  function getMul()  { return multiplier; }
  function getCount() { return count; }
  function getRemaining() { return timer / WINDOW; }
  function draw(ctx) {
    if (count < 2) return;
    const x = W / 2, y = 52;
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = '#FF88EE';
    ctx.fillStyle = '#FF88EE';
    ctx.font = 'bold 16px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText('x' + multiplier.toFixed(1) + '  ' + count + ' CHAIN', x, y);
    // Decay bar
    const bw = 120;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,136,238,0.3)';
    ctx.fillRect(x - bw/2, y + 6, bw, 3);
    ctx.fillStyle = '#FF88EE';
    ctx.fillRect(x - bw/2, y + 6, bw * getRemaining(), 3);
    ctx.restore();
  }
  return { onKill, tick, reset, getMul, getCount, draw };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: UI — ANIMATED SCORE ODOMETER
   Per-player HUD score lerps toward the real value for a classic arcade feel.
   ═══════════════════════════════════════════════════════════════════════════ */
function tickScoreDisplay(p) {
  if (p._scoreShown === undefined) p._scoreShown = p.score;
  if (p._scoreShown < p.score) {
    const delta = Math.max(1, Math.ceil((p.score - p._scoreShown) * 0.08));
    p._scoreShown = Math.min(p.score, p._scoreShown + delta);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: COLLISION
   ═══════════════════════════════════════════════════════════════════════════ */
function checkCollisions() {
  // Player bullets vs enemies
  game.bullets.forEach(b => {
    if(!b.isPlayer) return;
    game.enemies.forEach(e => {
      if(e.dead) return;
      if(Math.abs(b.x-e.x)<e.w/2+b.sz && Math.abs(b.y-e.y)<e.h/2+b.sz) {
        if(e.takeDamage(b.dmg)) {
          // Award score with combo multiplier
          Combo.onKill();
          const pts = Math.round(e.pts * Combo.getMul());
          game.players.forEach(p=>{ if(p.active) p.score+=pts; });
          game.totalScore+=pts;
          // Random power-up
          if(Math.random()<0.12) game.powerups.push(new PowerUp(e.x,e.y,PU_TYPES[rndInt(0,PU_TYPES.length-1)]));
        }
        if (b.piercing && b.piercing > 0) { b.piercing--; } else { b.dead=true; }
      }
    });
    // Boss
    if(game.boss&&!game.boss.dead&&!game.boss.entering) {
      const bx=game.boss, bw=bx.w/2+b.sz, bh=bx.h/2+b.sz;
      if(Math.abs(b.x-bx.x)<bw && Math.abs(b.y-bx.y)<bh) {
        if(bx.takeDamage(b.dmg)) {
          Combo.onKill();
          const pts = Math.round(bx.pts * Combo.getMul());
          game.players.forEach(p=>{ if(p.active) p.score+=pts; });
          game.totalScore+=pts;
          game.bossActive=false;
          Audio.playMusic(MUSIC_STAGE);
          if(Math.random()<0.5) game.powerups.push(new PowerUp(bx.x,bx.y,'SHIELD'));
          if(Math.random()<0.5) game.powerups.push(new PowerUp(bx.x+30,bx.y,'SHOT'));
          if(Math.random()<0.5) game.powerups.push(new PowerUp(bx.x-30,bx.y,'BOMB'));
        }
        if (b.piercing && b.piercing > 0) { b.piercing--; } else { b.dead=true; }
      }
    }
  });
  // Enemy bullets vs players
  game.bullets.forEach(b => {
    if(b.isPlayer) return;
    game.players.forEach(p => {
      if(!p.active||p.dying>0||p.respawnTimer>0) return;
      if(Math.abs(b.x-p.x)<p.w/2 && Math.abs(b.y-p.y)<p.h/2) {
        p.takeDamage(); b.dead=true;
      }
    });
  });
  // Enemies vs players (collision)
  game.enemies.forEach(e => {
    if(e.dead) return;
    game.players.forEach(p => {
      if(!p.active||p.dying>0||p.respawnTimer>0) return;
      if(Math.abs(e.x-p.x)<(e.w+p.w)/2-4 && Math.abs(e.y-p.y)<(e.h+p.h)/2-4) {
        p.takeDamage(); e.takeDamage(10);
      }
    });
  });
  // Boss vs players
  if(game.boss&&!game.boss.dead&&!game.boss.entering) {
    game.players.forEach(p => {
      if(!p.active||p.dying>0||p.respawnTimer>0) return;
      if(Math.abs(game.boss.x-p.x)<game.boss.w/2 && Math.abs(game.boss.y-p.y)<game.boss.h/2) {
        p.takeDamage();
      }
    });
  }
  // Power-ups vs players
  game.powerups.forEach(pu => {
    game.players.forEach(p => {
      if(!p.active) return;
      if(dist(pu,p)<24) {
        pu.dead=true;
        Audio.play('powerup');
        switch(pu.type) {
          case 'SHOT':   p.shotLevel=Math.min(5, p.shotLevel+1); showFlash('FIREPOWER LVL ' + p.shotLevel, 90, '#FF8800'); break;
          case 'SPEED':  p.speed=Math.min(5.5, p.speed+0.5); showFlash('SPEED UP!', 90, '#00FFFF'); break;
          case 'SHIELD': p.hasShield=true; p.shieldTime=600; showFlash('SHIELD!', 90, '#4488FF'); break;
          case 'BOMB':   p.bombs=Math.min(5, p.bombs+1); showFlash('BOMB +1', 90, '#FF4466'); break;
          case 'WEAPON': {
            const options = ['STANDARD','SPREAD','LASER','HOMING'].filter(w => w !== p.weapon);
            p.weapon = options[rndInt(0, options.length-1)];
            showFlash(p.weapon + '!', 90, '#FF88EE');
            break;
          }
        }
      }
    });
  });
}

function drawHUD() {
  ctx.save();

  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,36);

    tickScoreDisplay(p);
    const xl = side===0?8:W/2+4;
    ctx.shadowBlur=8; ctx.shadowColor=p.color;
    ctx.fillStyle=p.color; ctx.font='10px Orbitron';
    ctx.textAlign='left';
    ctx.fillText('P'+p.pid+' '+p._scoreShown.toString().padStart(7,'0'), xl, 14);

    for(let i=0;i<p.lives;i++) {
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.moveTo(xl+i*18+6,27); ctx.lineTo(xl+i*18,34); ctx.lineTo(xl+i*18+12,34);
      ctx.closePath(); ctx.fill();
    }
    // Bombs
    const bx = xl+(p.lives*18)+8;
    for(let i=0;i<p.bombs;i++) {
      ctx.fillStyle='#FF4466';
      ctx.beginPath(); ctx.arc(bx+i*14,30,5,0,Math.PI*2); ctx.fill();
    }
    // Weapon + shot level
    ctx.fillStyle=p.color; ctx.font='8px Share Tech Mono'; ctx.textAlign='left';

    ctx.fillText(wlabel+':'+p.shotLevel, xl+(p.lives*18)+(p.bombs*14)+16, 33);
    // Shield indicator
    if(p.hasShield) {
      ctx.fillStyle='#4488FF'; ctx.font='8px Share Tech Mono';
      ctx.fillText('SHLD', xl+(p.lives*18)+(p.bombs*14)+50, 33);
    }
  }
  drawPlayerHUD(game.players[0], 0);
  if(game.players.length>1) drawPlayerHUD(game.players[1], 1);
  // Combo overlay (above top bar)
  Combo.draw(ctx);
  // Level / Diff
  ctx.shadowBlur=6; ctx.shadowColor=dc.color;
  ctx.fillStyle=dc.color; ctx.font='9px Orbitron'; ctx.textAlign='center';
  ctx.fillText(dc.name+' · LV '+game.level+'/'+game.maxLevel, W/2, 12);
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='8px Share Tech Mono';
  // Controls hint (first few seconds)
  ctx.restore();
}

  { key: 'slowMo',        label: 'SLOW-MO',       type: 'bool' },
  { key: 'reducedMotion', label: 'REDUCED MOTION',type: 'bool' },
  { key: 'colorblind',    label: 'COLORBLIND',    type: 'enum',   values: ['off','protan','deutan','tritan'] },
  { kind: 'action',       label: 'KEY BINDINGS' },
  { kind: 'action',       label: 'RESET DEFAULTS' },
  { kind: 'action',       label: 'BACK TO MENU' },
];
function handleOptionsInput(up, dn, lf, rt, ok, back) {
  if (up) { game.optionsSel = (game.optionsSel + OPTIONS_ITEMS.length - 1) % OPTIONS_ITEMS.length; Audio.play('menu_move'); return; }
  if (dn) { game.optionsSel = (game.optionsSel + 1) % OPTIONS_ITEMS.length; Audio.play('menu_move'); return; }
  const it = OPTIONS_ITEMS[game.optionsSel];
  if (it.kind === 'action') {
    if (ok) {
      Audio.play('menu_confirm');
      if (it.label.startsWith('RESET')) { Config.reset(); Audio.applyVolumes(); Toasts.push('DEFAULTS RESTORED','#88CCFF'); }
      else if (it.label.startsWith('KEY')) { game.state = GS.BINDINGS; game.bindingsSel = 0; }
      else { game.state = GS.MENU; }
    }
    return;
  }
  if (back) { game.state = GS.MENU; Audio.play('menu_move'); return; }
  const cur = Config.get(it.key);
  let changed = false, next = cur;
  if (it.type === 'slider') {
    if (lf) next = Math.max(it.min, +(cur - it.step).toFixed(2));
    if (rt) next = Math.min(it.max, +(cur + it.step).toFixed(2));
    if (next !== cur) changed = true;
  } else if (it.type === 'enum') {
    const i = it.values.indexOf(cur);
    if (lf) { next = it.values[(i + it.values.length - 1) % it.values.length]; changed = true; }
    if (rt) { next = it.values[(i + 1) % it.values.length]; changed = true; }
  } else if (it.type === 'bool') {
    if (lf || rt || ok) { next = !cur; changed = true; }
  }
  if (changed) {
    Config.set(it.key, next);
    Audio.play('menu_move');
    if (it.key.startsWith('vol')) Audio.applyVolumes();
  }
}

        valText = '◄ ' + String(val).toUpperCase() + ' ►';

        ctx.fillStyle = val ? '#44FF88' : '#888888';
        ctx.fillText(valText, W - 32, y);
      }
    }
  });

];
function handleBindingsInput(up, dn, ok, back) {
  if (capturingFor) return; // globally captured; ignore menu nav
  const total = BINDING_ACTIONS.length + BINDINGS_MENU_EXTRA.length;

// ── High Scores ────────────────────────────────────────────────────────────
const MAX_HIGH_SCORES = 10;
function getHighScores() {
  const all = Config.get('highScores') || [];
  return Array.isArray(all) ? all : [];
}
function topScoresForDiff(diff) {
  return getHighScores()
    .filter(s => s.diff === diff)
    .sort((a,b) => b.score - a.score)
    .slice(0, MAX_HIGH_SCORES);
}
function isHighScore(score, diff) {
  const list = topScoresForDiff(diff);
  return list.length < MAX_HIGH_SCORES || score > list[list.length - 1].score;
}
function addHighScore(entry) {
  const all = getHighScores().concat([entry]);
  Config.set('highScores', all.slice(-200)); // cap storage
}
function queueHighScoreIfQualifies() {
  const score = game.totalScore | 0;
  if (score <= 0) return;
  if (!isHighScore(score, game.diff)) return;
  game.pendingScore = { score, diff: game.diff, mode: game.mode };
  game.nameEntryChars = ['A','A','A'];
  game.nameEntryCursor = 0;
  // Defer the state change so the game-over SFX/visuals land first. Only
  // transition if the player hasn't already left the game-over screen.
  setTimeout(() => {
    if (game.pendingScore && (game.state === GS.GAMEOVER || game.state === GS.VICTORY)) {
      game.state = GS.NAME_ENTRY;
    } else {
      game.pendingScore = null;
    }
  }, 1200);
}
function drawHighScores() {
  drawStars();
  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = '#FFAA88';
  ctx.fillStyle = '#FFAA88'; ctx.font = '22px Orbitron'; ctx.textAlign = 'center';
  ctx.fillText('HIGH SCORES', W/2, 60);
  ctx.shadowBlur = 0;
  // Difficulty tabs
  DIFF_CFG.forEach((d, i) => {
    const x = W/4 * (i+1);
    const sel = game.scoresTab === i;
    ctx.globalAlpha = sel ? 1 : 0.55;
    ctx.fillStyle = sel ? d.color : 'rgba(255,255,255,0.5)';
    ctx.font = '11px Orbitron';
    ctx.fillText(d.name, x, 95);
    if (sel) {
      ctx.fillRect(x - 40, 100, 80, 2);
    }
  });
  ctx.globalAlpha = 1;
  // List
  const scores = topScoresForDiff(game.scoresTab);
  ctx.textAlign = 'left'; ctx.font = '12px Share Tech Mono';
  if (scores.length === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'center';
    ctx.fillText('— NO SCORES YET —', W/2, 200);
    ctx.fillText('BE THE FIRST.',     W/2, 220);
  } else {
    const top = 140;
    scores.forEach((s, i) => {
      const y = top + i * 22;
      ctx.fillStyle = i === 0 ? '#FFB800' : i < 3 ? '#FFEEBB' : 'rgba(255,255,255,0.75)';
      ctx.textAlign = 'left';
      ctx.fillText(String(i+1).padStart(2,' ') + '.', 40, y);
      ctx.fillText(s.initials || '---', 76, y);
      ctx.textAlign = 'right';
      ctx.fillText(String(s.score).padStart(8,'0'), W - 80, y);
      ctx.fillText((s.mode === 2 ? '2P' : '1P'), W - 40, y);
    });
  }
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '9px Share Tech Mono'; ctx.textAlign = 'center';
  ctx.fillText('A/D or ←/→ SWITCH DIFFICULTY · ESC BACK', W/2, H - 24);
  ctx.restore();
}

// ── Name Entry (3 initials on new high score) ─────────────────────────────
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_';
function handleNameEntryInput(up, dn, lf, rt, ok) {
  if (lf) { game.nameEntryCursor = (game.nameEntryCursor + 2) % 3; Audio.play('menu_move'); return; }
  if (rt) { game.nameEntryCursor = (game.nameEntryCursor + 1) % 3; Audio.play('menu_move'); return; }
  const curChar = game.nameEntryChars[game.nameEntryCursor];
  const i = ALPHABET.indexOf(curChar);
  if (up) { game.nameEntryChars[game.nameEntryCursor] = ALPHABET[(i + ALPHABET.length - 1) % ALPHABET.length]; Audio.play('menu_move'); return; }
  if (dn) { game.nameEntryChars[game.nameEntryCursor] = ALPHABET[(i + 1) % ALPHABET.length]; Audio.play('menu_move'); return; }
  if (ok) {
    if (game.nameEntryCursor < 2) {
      game.nameEntryCursor++;
      Audio.play('menu_move');

      Audio.play('menu_confirm');

      game.state = GS.HIGHSCORES;

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: INPUT — MENU PROCESSING
   ═══════════════════════════════════════════════════════════════════════════ */
const justPressed = {};
function checkJustPressed(code) {
  if(keys[code]&&!justPressed[code]) { justPressed[code]=true; return true; }
  if(!keys[code]) justPressed[code]=false;
  return false;
}

let tapFlag=false;
canvas.addEventListener('click', ()=>{ tapFlag=true; });
canvas.addEventListener('touchend', ()=>{ tapFlag=true; });

function handleMenuInput() {
  const up = checkJustPressed('KeyW')||checkJustPressed('ArrowUp');
  const dn = checkJustPressed('KeyS')||checkJustPressed('ArrowDown');
  const lf = checkJustPressed('KeyA')||checkJustPressed('ArrowLeft');
  const rt = checkJustPressed('KeyD')||checkJustPressed('ArrowRight');
  const ok = checkJustPressed('Space')||checkJustPressed('Enter')||tapFlag;
  const back = checkJustPressed('Escape');
  tapFlag=false;
  if(game.state===GS.MENU) {
    if(up) { game.menuSel=Math.max(0,game.menuSel-1); Audio.play('menu_move'); }
    if(dn) { game.menuSel=Math.min(MENU_ITEMS.length-1,game.menuSel+1); Audio.play('menu_move'); }
    if(ok) {
      const it = MENU_ITEMS[game.menuSel];
      Audio.play('menu_confirm');
      if (it.kind === 'diff')      { game.diff = it.diff; game.state = GS.MODE; game.modeSel = 0; }
      else if (it.target === 'OPTIONS')    { game.state = GS.OPTIONS;    game.optionsSel = 0; }
      else if (it.target === 'HIGHSCORES') { game.state = GS.HIGHSCORES; game.scoresTab = game.diff; }
    }
  } else if(game.state===GS.MODE) {
    if(up) { game.modeSel=0; Audio.play('menu_move'); }
    if(dn) { game.modeSel=1; Audio.play('menu_move'); }
    if(back) { game.state = GS.MENU; Audio.play('menu_move'); }
    if(ok) {
      game.mode=game.modeSel+1; game.level=1; initGame(); game.state=GS.PLAYING;
      document.getElementById('mobile-controls').style.display = game.isMobile||true?'block':'none';
      Audio.play('menu_confirm');
      Audio.playMusic(MUSIC_STAGE);
    }
  } else if(game.state===GS.OPTIONS) {
    handleOptionsInput(up, dn, lf, rt, ok, back);
  } else if(game.state===GS.HIGHSCORES) {
    if(lf) { game.scoresTab = (game.scoresTab + 2) % 3; Audio.play('menu_move'); }
    if(rt) { game.scoresTab = (game.scoresTab + 1) % 3; Audio.play('menu_move'); }
    if(ok || back) { game.state = GS.MENU; Audio.play('menu_move'); }
  } else if(game.state===GS.BINDINGS) {
    handleBindingsInput(up, dn, ok, back);
  } else if(game.state===GS.NAME_ENTRY) {
    handleNameEntryInput(up, dn, lf, rt, ok);
  } else if(game.state===GS.GAMEOVER||game.state===GS.VICTORY) {
    if(ok) {
      game.pendingScore = null;
      game.state=GS.MENU; Audio.play('menu_confirm'); Audio.playMusic(MUSIC_MENU);
    }
  } else if(game.state===GS.PAUSED) {
    if(back||ok) { game.state=GS.PLAYING; Audio.play('menu_confirm'); }
  } else if(game.state===GS.PLAYING) {
    if(back) { game.state=GS.PAUSED; Audio.play('menu_move'); }
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENGINE — UPDATE
   ═══════════════════════════════════════════════════════════════════════════ */
function update() {
  Gamepad.poll();
  handleMenuInput();
  Toasts.update();
  // Slow-motion: stochastically skip physics ticks so time dilates smoothly.
  const ts = Camera.timeScale();
  if (game.state === GS.PLAYING && ts < 1 && Math.random() > ts) return;
  if(game.state===GS.LEVEL_CLEAR) {
    game.levelClearTimer++;
    if(game.levelClearTimer>160) {
      game.level++;
      if(game.level>game.maxLevel) {
        game.state=GS.VICTORY; Audio.stopMusic(); Audio.play('powerup');
        queueHighScoreIfQualifies();
      }
      else {
        game.enemies=[]; game.bullets=[]; game.powerups=[];
        game.boss=null; game.bossActive=false;
        game.waves=getLevelWaves(game.diff,game.level);
        game.currentWave=0; game.waveSpawnTimer=0;
        game.spawnedEnemies=[...game.waves[0]];
        game.state=GS.PLAYING;
        showFlash('LEVEL '+game.level);
        Audio.playMusic(MUSIC_STAGE);
        // Refill shield on novice between levels
        if(DIFF_CFG[game.diff].shield) game.players.forEach(p=>{ if(p.active){p.hasShield=true;p.shieldTime=600;} });
      }
    }
  }
  if(game.state!==GS.PLAYING) return;
  // Spawn enemies
  game.waveSpawnTimer++;
  if(game.spawnedEnemies.length>0 && game.waveSpawnTimer%30===0) spawnEnemy();
  // Check wave clear
  if(game.spawnedEnemies.length===0 && game.enemies.filter(e=>!e.dead).length===0) {
    if(game.bossActive && game.boss && !game.boss.dead) { /* boss still alive */ }
    else if(game.boss && game.boss.dead) {
      // Level clear!
      game.state=GS.LEVEL_CLEAR; game.levelClearTimer=0;
      explode(W/2,H/2,'#FFB800',80,6);
      Confetti.burst(W/2, H-80, ['#FFB800','#FF4466','#44FF88','#44AAFF'], 80);
    } else if(!game.bossActive) {
      startNextWave();
    }
  }
  // Update entities
  game.enemies.forEach(e => e.update(game.bullets, game.players));
  game.enemies = game.enemies.filter(e=>!e.dead);
  if(game.boss) { game.boss.update(game.bullets,game.players); if(game.boss.dead&&!game.bossActive) {} }
  game.bullets.forEach(b=>b.update());
  game.bullets = game.bullets.filter(b=>!b.dead);
  game.powerups.forEach(pu=>pu.update());
  game.powerups = game.powerups.filter(pu=>!pu.dead);
  game.wrecks.forEach(w => w.update(game.players));
  game.wrecks = game.wrecks.filter(w => !w.dead);
  particles.forEach(p=>p.update());
  particles = particles.filter(p=>p.life>0);
  Confetti.update();
  Combo.tick();
  // Players
  game.players.forEach(p => { if(p.active||p.dying>0||p.respawnTimer>0) p.update(game.bullets); });
  // Check collisions
  checkCollisions();
  // Game over check — in 2P, a pending wreck keeps hope alive.
  const anyAlive  = game.players.some(p => p.active || p.dying>0 || p.respawnTimer>0);
  const canRevive = game.mode === 2 && game.wrecks.length > 0 &&
                    game.players.some(p => p.active || p.dying>0 || p.respawnTimer>0);
  if (!anyAlive && !canRevive) {
    game.state=GS.GAMEOVER; menuT=0;
    Audio.play('explode_big');
    Audio.stopMusic();
    queueHighScoreIfQualifies();
  }
  // Flash
  if(game.flashTimer>0) game.flashTimer--;
  if(game.screenFlash>0) game.screenFlash--;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENGINE — DRAW
   ═══════════════════════════════════════════════════════════════════════════ */
function draw() {
  const now = performance.now();
  ctx.save();
  Camera.preRender(ctx, now);
  ctx.fillStyle='#000005'; ctx.fillRect(0,0,W,H);
  const splat = GSplat.active();
  const inWorld = game.state===GS.PLAYING || game.state===GS.PAUSED ||
                  game.state===GS.LEVEL_CLEAR || game.state===GS.GAMEOVER || game.state===GS.VICTORY;
  // Splat mode renders the whole 3D scene (background + world) in one sorted
  // pass and composites it here; classic mode keeps the original 2D path.
  if (splat) GSplat.frame(now, inWorld);
  else drawStars();
  if(game.state===GS.MENU)       { drawMenu();       ctx.restore(); Camera.postRender(ctx, now); CRT.draw(canvas, now); return; }
  if(game.state===GS.MODE)       { drawModeSelect(); ctx.restore(); Camera.postRender(ctx, now); CRT.draw(canvas, now); return; }
  if(game.state===GS.OPTIONS)    { drawOptions();    ctx.restore(); Camera.postRender(ctx, now); CRT.draw(canvas, now); return; }
  if(game.state===GS.BINDINGS)   { drawBindings();   ctx.restore(); Camera.postRender(ctx, now); CRT.draw(canvas, now); return; }
  if(game.state===GS.HIGHSCORES) { drawHighScores(); ctx.restore(); Camera.postRender(ctx, now); CRT.draw(canvas, now); return; }
  if(game.state===GS.NAME_ENTRY) { drawNameEntry();  ctx.restore(); Camera.postRender(ctx, now); CRT.draw(canvas, now); return; }
  // Playing / paused / level clear
  if (splat) {
    drawWorldOverlays(ctx);
  } else {
    particles.forEach(p=>p.draw(ctx));
    game.powerups.forEach(pu=>pu.draw(ctx));
    game.wrecks.forEach(w => w.draw(ctx));
    game.enemies.forEach(e=>e.draw(ctx));
    if(game.boss&&!game.boss.dead) game.boss.draw(ctx);
    game.bullets.forEach(b=>b.draw(ctx));
    game.players.forEach(p=>{ if(p.active||p.dying>0||p.respawnTimer>0) p.draw(ctx); });
  }
  Confetti.draw(ctx);
  // HUD
  drawHUD();
  // Screen flash (legacy — Camera.flash now handles most cases)
  if(game.screenFlash>0) {
    ctx.fillStyle=`rgba(255,200,100,${game.screenFlash/15*0.4})`;
    ctx.fillRect(0,0,W,H);
  }
  // Damage vignette on invulnerability frames + low-life pulse.
  const anyHit = game.players.some(p => p.invTime > 0 && p.invTime < 90);
  const anyLow = game.players.some(p => p.active && p.lives <= 1);
  if (anyHit || anyLow) {
    const pulse = anyLow ? (0.18 + Math.sin(performance.now()/120) * 0.08) : 0;
    const hitA  = anyHit ? 0.38 : 0;
    const grad = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.65);
    grad.addColorStop(0,'rgba(255,0,32,0)');
    grad.addColorStop(1,`rgba(255,0,32,${Math.max(hitA, pulse)})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }
  // Toasts (replaces the single flash message for stacked UX feedback)
  Toasts.draw(ctx);
  if(game.state===GS.LEVEL_CLEAR) drawLevelClear();
  if(game.state===GS.GAMEOVER) { menuT++; drawGameOver(false); }
  if(game.state===GS.VICTORY) { menuT++; drawGameOver(true); }
  if(game.state===GS.PAUSED) drawPaused();
  ctx.restore();
  Camera.postRender(ctx, now);
  CRT.draw(canvas, now);
}

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION: ENGINE — MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
function loop() {
  update(); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Show mobile controls always (they're nearly invisible until touch)
document.getElementById('mobile-controls').style.display = 'block';

// Apply persisted config to DOM overlays on boot.
applyConfig();

// Register audio gesture listeners and start menu music on first interaction.
Audio.resumeOnGesture();
const bootMusic = () => {
  Audio.ensure();
  Audio.playMusic(MUSIC_MENU);
  window.removeEventListener('pointerdown', bootMusic);
  window.removeEventListener('keydown',     bootMusic);
  window.removeEventListener('touchstart',  bootMusic);
};
window.addEventListener('pointerdown', bootMusic, { once: true });
window.addEventListener('keydown',     bootMusic, { once: true });
window.addEventListener('touchstart',  bootMusic, { once: true });

console.log('[1977] build', BUILD_VERSION);
</script>
